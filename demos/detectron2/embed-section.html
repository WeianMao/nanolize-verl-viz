const sp=pt.tier===2&&lit>.4?"crown":(lit>.25?"pass":"moss"),a=lerp(pt.tier?.58:.4,pt.tier?.96:.74,lit)*tw*fade,gr=rad*lerp(.88,1.24,lit);
stamp(ctxN,sp,pt.x,pt.y,gr,a);if(pt.tier)stamp(ctxN,sp,pt.x,pt.y,gr*.48,a*.72);else stamp(ctxN,sp,pt.x,pt.y,gr*.26,a*.62,1);
if(fl>.03)stamp(ctxN,"hot",pt.x,pt.y,gr*(1.2+.9*fl),fl*.85*fade);
});
if(tN>.001){const act=!fin,pul=calm?1:.92+.12*Math.sin(t*(act?5.2:2.1)),ba=(act?.98:.72)*fade;stamp(ctxN,"blN",hx,hy,(act?28:24)*sc*pul,ba*.9);stamp(ctxN,"agN",hx,hy,(act?16:13)*sc*pul,ba);if(act)stamp(ctxN,"crown",hx,hy,4.6*sc,ba,1);}
if(tag&&tag.a>.04)drawFileTag(ctxN,tag.x,tag.y,tag.name,2,L.t7,tag.a,szN.w,szN.h,sc,szN.f);
if(fin&&fg>.05){
const ck=fg*fade,cr=11.5*sc;
ctxN.save();ctxN.globalCompositeOperation="source-over";
ctxN.fillStyle=`rgba(19,30,9,${(.88*ck).toFixed(3)})`;ctxN.strokeStyle=`rgba(139,206,55,${(.92*ck).toFixed(3)})`;ctxN.lineWidth=1.4*sc;
ctxN.beginPath();ctxN.arc(fPt.x,fPt.y,cr,0,TAU);ctxN.fill();ctxN.stroke();
ctxN.strokeStyle=`rgba(241,248,230,${(.98*ck).toFixed(3)})`;ctxN.lineWidth=1.9*sc;ctxN.lineCap="round";ctxN.lineJoin="round";
ctxN.beginPath();ctxN.moveTo(fPt.x-4.2*sc,fPt.y+.4*sc);ctxN.lineTo(fPt.x-1.2*sc,fPt.y+3.5*sc);ctxN.lineTo(fPt.x+4.8*sc,fPt.y-3.4*sc);ctxN.stroke();ctxN.restore();
}
}

function syncDOM(p,r){
const task=TASKS[key],nf=task.nf,pNf=SPLIT+(1-SPLIT)*nf,oDone=r>=.999,nDone=r>=nf;
const oCur=oDone?task.oTok:Math.round(r*task.oTok),nCur=Math.min(task.nTok,oCur);
pEl.textContent=task.prompt;
const spT=clamp(p/.065,0,1),spVis=p>.001&&p<.078,off=lerp(100,-28,ease(spT)).toFixed(1),op=spVis?clamp(Math.sin(spT*Math.PI)*1.2,0,1).toFixed(2):"0";
pPill.classList.toggle("is-pulse",p>.001&&p<.09);
for(const el of[fkL,fkR]){el.setAttribute("stroke-dashoffset",off);el.setAttribute("opacity",op);}
cntO.textContent=fmt(oCur);cntN.textContent=fmt(nCur);
const pct=v=>(v*100).toFixed(3)+"%",nfP=pct(nf),baseP=pct(Math.min(r,nf)),over=Math.max(0,r-nf)*100;
bO.style.width=baseP;bO.classList.toggle("has-over",over>.05);bOver.style.left=nfP;bOver.style.width=over.toFixed(3)+"%";bNotch.style.left=nfP;bN.style.width=baseP;
const sNfP=pct(pNf);sFill.style.width=pct(Math.min(p,pNf));sOver.style.left=sNfP;sOver.style.width=pct(Math.max(0,p-pNf));sTick.style.left=sNfP;sThumb.style.left=pct(p);
scrub.setAttribute("aria-valuenow",String(Math.round(p*100)));
paneO.classList.toggle("is-done",oDone);paneO.classList.toggle("is-over",r>nf);paneN.classList.toggle("is-done",nDone);
for(const[el,dn]of[[stO,oDone],[stN,nDone]]){el.classList.toggle("is-done",dn);el.classList.toggle("is-live",!dn&&playing);el.setAttribute("aria-label",dn?"Done":"Searching");}
badge.textContent=task.save;badge.classList.toggle("is-shown",nDone);
iPause.style.display=playing?"block":"none";iPlay.style.display=playing?"none":"block";
tog.setAttribute("aria-label",playing?"Pause animation":"Play animation");
}

const render=f=>{const c=isCalm(),r=clamp((prog-SPLIT)/(1-SPLIT),0,1);drawOrig(prog,r,amb,c,f);drawNano(prog,r,amb,c,f);syncDOM(prog,r);};
function step(now){
raf=0;if(!visible)return;
const dt=lastMs?Math.min(.05,(now-lastMs)/1000):0;lastMs=now;
const c=isCalm();if(!c)amb+=dt;
let fade=1;
if(playing&&!dragging&&!c){
if(phase==="race"){prog+=dt/RACE;if(prog>=1){prog=1;phase="hold";pTime=0;}}
else if(phase==="hold"){pTime+=dt;if(!manual&&pTime>=HOLD){phase="fade";pTime=0;}}
else{pTime+=dt;const ft=clamp(pTime/FADE,0,1);fade=1-ease(ft);if(ft>=1){prog=0;phase="race";pTime=0;fade=1;}}
}
render(fade);if(!c&&visible)raf=win.requestAnimationFrame(step);
}
const sched=()=>{if(!raf&&visible){lastMs=0;raf=win.requestAnimationFrame(step);}};

const on=(el,ev,fn)=>el.addEventListener(ev,fn);
tBtns.forEach(btn=>on(btn,"click",()=>{
const k=btn.dataset.nzd2Task;if(!TASKS[k])return;
key=k;tBtns.forEach(b=>b.setAttribute("aria-pressed",b.dataset.nzd2Task===k?"true":"false"));
if(isCalm()){prog=1;phase="hold";playing=false;}else{prog=0;phase="race";pTime=0;playing=true;manual=false;}
render(1);sched();
}));
on(tog,"click",()=>{if(playing){playing=false;manual=true;}else{if(prog>=.999){prog=0;phase="race";pTime=0;}playing=true;manual=false;}render(1);sched();});
on(rep,"click",()=>{prog=isCalm()?1:0;phase=isCalm()?"hold":"race";pTime=0;playing=!isCalm();manual=isCalm();render(1);sched();});
const seekAt=x=>{const r=scrub.getBoundingClientRect();if(r.width<=0)return;prog=clamp((x-r.left)/r.width,0,1);phase=prog>=1?"hold":"race";pTime=0;playing=false;manual=true;render(1);};
on(scrub,"pointerdown",ev=>{dragging=true;scrub.classList.add("is-dragging");try{scrub.setPointerCapture&&scrub.setPointerCapture(ev.pointerId);}catch(_){}seekAt(ev.clientX);});
on(scrub,"pointermove",ev=>{if(dragging)seekAt(ev.clientX);});
const endD=()=>{dragging=false;scrub.classList.remove("is-dragging");};
on(scrub,"pointerup",endD);on(scrub,"pointercancel",endD);
on(scrub,"keydown",ev=>{
if(ev.key==="ArrowRight"||ev.key==="ArrowUp")prog=clamp(prog+.05,0,1);
else if(ev.key==="ArrowLeft"||ev.key==="ArrowDown")prog=clamp(prog-.05,0,1);
else if(ev.key==="Home")prog=0;else if(ev.key==="End")prog=1;
else if(ev.key===" "||ev.key==="Enter"){ev.preventDefault();tog.click();return;}else return;
ev.preventDefault();playing=false;manual=true;render(1);
});
const onResize=()=>{const a=measure(cO,szO),b=measure(cN,szN);if(a||b)render(1);};
if(typeof win.ResizeObserver==="function"){const ro=new win.ResizeObserver(onResize);ro.observe(cO);ro.observe(cN);}else on(win,"resize",onResize);
if(typeof win.IntersectionObserver==="function")new win.IntersectionObserver(es=>{for(const e of es){visible=e.isIntersecting;if(visible)sched();else if(raf){win.cancelAnimationFrame(raf);raf=0;}}},{threshold:.05}).observe(root);
if(redQ&&typeof redQ.addEventListener==="function")on(redQ,"change",()=>{if(isCalm()){prog=1;playing=false;manual=true;if(raf){win.cancelAnimationFrame(raf);raf=0;}render(1);}else{playing=true;manual=false;sched();}});
onResize();render(1);if(!isCalm())sched();
}

const boot=()=>document.querySelectorAll(".nzd2-section:not([data-nzd2-init])").forEach(initSection);
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});else boot();
})();
</script>
