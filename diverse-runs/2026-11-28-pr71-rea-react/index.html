    // the scope baseline: the pause of a job whose run found too much, its item in stage 03, and what a delivery set aside
    "Paused in its freeze: one run of the scope baseline found more than a job goes on with by itself. Each finding is a check of a kept capability that the run newly shows failing on the original once what the selection removes is taken out, twice and the same way, and passing on the original unchanged; such a check is a finding also where the baseline's tree attributes no check. The job has called no author since. Either cancel it and start a job with a corrected selection (keep the capability, declare the dependency, move the file to a kept capability or carry it), or resume it: it goes on with what it found. A check that a candidate then fails only as the scope baseline shows it failing is never sent to an author, and a delivery carries it as a gap; where a kept file cannot be imported in the baseline's tree, no check is attributed to the scope and each stays its author's to make pass. The job's events say how many findings and for which capabilities; its scope-baseline.json names the checks with what each misses, the places in kept code that use a removed name, and the kept files that cannot be imported.":
      "已在冻结阶段暂停：范围基线的一次运行发现的问题，超过了作业自己继续往下跑的上限。每一项问题是保留能力的一项检查：这次运行新发现它在去掉被排除部分的原版上失败，跑了两次、两次失败的方式相同，而在未改动的原版上通过；基线的树无法把检查归因时，这样的检查同样算作问题。此后作业没有调用过作者。可以取消这个作业、改正选择后另起一个（保留那项能力、声明依赖、把文件移到保留的能力里，或者把它列为 carry）；也可以续跑：作业带着已经发现的问题继续。之后候选版本如果只是像范围基线里那样让某项检查失败，这项检查不会交给作者去修，交付时记为缺口；如果基线的树里有保留的文件无法导入，就没有检查归因于范围，每项检查仍由作者负责修到通过。有多少项问题、涉及哪些能力，见作业的事件；作业的 scope-baseline.json 里记着这些检查和各自缺的东西、保留代码里用到被排除名字的位置，以及无法导入的保留文件。",

      // its stage states and its focus are what the page shows, the stage model's are the fallback.
      const byId = new Map(flow.stages.map(stage => [stage.id, stage.state]));

    const place = summary.place === "slurm" ? T("on a compute node") : summary.place === "local" ? T("where the job runs")
      : summary.place === "worker" ? T("in the job's process") : "";
    if (place) parts.push(place);
    if (detail && summary.by_processor_time > 0) parts.push(T("{n} judged by processor time: on that machine the seconds of equal code varied more than the tolerance, and for those a candidate is not held to the time it waits (a sleep, a lock, the network, a child process)",
      {n: summary.by_processor_time}));
    // The command claims alone were measured, of code whose behavior comparison left gaps (performance.UNVERIFIED).
    if (summary.behavior === "not_fully_verified") parts.push(T("behavior not fully verified: only the project's own benchmark commands were measured"));

  }
  // Only a comparison that passed is done; a slower candidate is delivered with a gap, never failed.
  // Where the project declares no performance nothing was to be held: that is neither done nor a gap,
  // the step had nothing to do.
  const performanceStatus = summary => summary.status === "passed" ? "done" : summary.status === "not_declared" ? "skipped" : "gap";
  /* The project's performance claims of a job that measures what the project itself declares
     (result.performance.claims, performance_evidence.claim_rows), one line each for the delivery's
     item. A row's status "measured" says only that a benchmark of the claim is frozen: it was timed
     on the original when the contract was frozen. Whether the delivered code was measured against
     it is the row's `compared` (claimCompared), and the line says which:
     - compared: the claim's id; on which device it was measured, with how many GPUs (a measurement
       uses one at most) against how many the project's own statement names; and the worst its
       criteria showed against the original, or that it decides nothing (a claim without a criterion);
     - not compared: that a benchmark is frozen, for which device, and that the delivered code was
       not measured against it, with why where the row says (`uncompared`), and that it decides
       nothing where it has no criterion. Never "measured on", and no number of GPUs: none was used;
     - no benchmark at all (any other status): not measured, with why.
     A reason is said in the words of CLAIM_REASONS (a code without words there is shown with spaces
     for its underscores). Only a claim that held is done and only one that did not is a gap; a line
     that says what was not measured judges nothing. A result is the job's own record, passed on as
     it is: a row that names no claim is not shown (claimRows), and a value that has not its form is
     not read. [] for a summary that lists no claim (a job that measures its leaves, one from before
     there were scopes). */
  const claimRows = summary => (summary && Array.isArray(summary.claims) ? summary.claims.slice(0, 200) : [])
    .filter(claim => claim && typeof claim === "object" && typeof claim.id === "string" && /^[a-z0-9][a-z0-9-]{0,39}$/.test(claim.id));
  const CLAIM_OUTCOMES = ["passed", "slower", "error", "timed_out", "inconclusive"];  // the worst a compared claim's criteria showed
  // Whether the comparison bound to the delivered code measured a benchmark of the claim. A row written before
  // rows said so (no `compared`) was compared where it has an outcome, and is taken as not compared otherwise.
  const claimCompared = claim => Object.hasOwn(claim, "compared") ? claim.compared === true : CLAIM_OUTCOMES.includes(claim.outcome);
  function claimLines(summary) {
    const outcomes = {passed: T("within the allowed difference"), slower: T("slower than allowed"), error: T("raised an error"),
      timed_out: T("timed out"), inconclusive: T("inconclusive")};
    const code = value => typeof value === "string" && CODE.test(value) ? value : "";
    const words = value => Object.hasOwn(CLAIM_REASONS, value) ? T(CLAIM_REASONS[value]) : value.replaceAll("_", " ");
    return claimRows(summary).map(claim => {
      const why = words(code(claim.reason));
      if (claim.status !== "measured")
        return {label: claim.id + " · " + (why ? T("not measured: {reason}", {reason: why}) : T("not measured")), status: "notrun"};
      const device = claim.device === "gpu" ? "GPU" : "CPU";
      const idle = claim.criteria !== 0 ? "" : why ? T("decides nothing: {reason}", {reason: why}) : T("decides nothing");
      if (!claimCompared(claim)) {
        // Why its benchmarks were not measured in a comparison that ran for others: no GPU where it ran, or a reason of the list.
        // Said of the comparison, not of the design (CLAIM_REASONS words the design's).
        const comparing = {no_gpu_available: T("no GPU could be had"), budget_exhausted: T("the job's time ran out before it was measured"),
          export_unavailable: T("a tree could not be exported to measure it")};
        const left = Object.hasOwn(comparing, code(claim.uncompared)) ? comparing[code(claim.uncompared)] : words(code(claim.uncompared));
        return {label: [claim.id, T("benchmark frozen on {device} (timed on the original when the contract was frozen)", {device}),
          left ? T("the delivered code was not measured against it: {reason}", {reason: left}) : T("the delivered code was not measured against it"),
          idle].filter(Boolean).join(" · "), status: "notrun"};
      }
      const named = Number.isInteger(claim.claimed_gpus) && claim.claimed_gpus > 0 ? claim.claimed_gpus : 0;
      const where = T("measured on {device} with {gpus}", {device, gpus: plural(claim.gpus === 1 ? 1 : 0, "GPU")})
        + (named ? T(" (the project names {n})", {n: named}) : "");
      const decided = Object.hasOwn(outcomes, claim.outcome);
      return {label: [claim.id, where, decided ? outcomes[claim.outcome] : idle].filter(Boolean).join(" · "),
        status: !decided ? "skipped" : claim.outcome === "passed" ? "done" : "gap"};
    });
  }
  /* The claims in numbers, before their lines. Where a comparison ran (`ran`): how many were measured on the
     delivered code, how many of those on a GPU and how many of those decide nothing; how many have a frozen
     benchmark the delivered code was not measured against; and how many have no benchmark. Where none ran
     nothing was measured on the delivered code, so only this is said: how many have a frozen benchmark, and how
     many have none. [] for a summary that lists no claim. */
  function claimCounts(summary, ran) {
    const rows = claimRows(summary), frozen = rows.filter(claim => claim.status === "measured"), compared = frozen.filter(claimCompared);
    const none = rows.length - frozen.length, left = frozen.length - compared.length;
    if (!rows.length) return [];
    if (!ran) return [T("{frozen} of {claims} performance claims of the project with a frozen benchmark, {none} with none",
      {frozen: frozen.length, claims: rows.length, none})];
    const onGpu = compared.filter(claim => claim.gpus === 1).length, idle = compared.filter(claim => claim.criteria === 0).length;
    return [T("{measured} of {claims} performance claims of the project measured on the delivered code", {measured: compared.length, claims: rows.length}),
      onGpu ? T("{n} of them on a GPU", {n: onGpu}) : "", idle ? T("{n} of them deciding nothing", {n: idle}) : "",
      left ? T("{n} with a frozen benchmark not measured on the delivered code", {n: left}) : "",
      none ? T("{n} with no benchmark", {n: none}) : ""].filter(Boolean);
  }
  /* The command claims of a job whose manifest declares the project's own benchmark commands
     (performance_evidence.command_rows), for the performance item of an attempt and of the delivery: one line
     for each number of a claim that ran on the original when the contract was frozen, and one line for a claim
     that did not, with why.
     - a number the comparison measured on both sides: the claim's id and the number's name, which direction is
       the better one, the medians of the original and of the candidate, how much worse or better the candidate
       is with what it was allowed, the spread of the original's repeats with the spread a criterion may have,
       and the verdict;
     - a number the comparison has no figures for: the verdict with why (the command failed, the output does not
       hold the number), or that the delivered code was not measured against it, with the original's figure of
       the freeze;
     - a number that is no criterion says so, with why (not stable enough, with the spread that was measured).
     Only a criterion that held is done and only one that did not is a gap. A row or a number that has not its
     form is not shown. [] for a summary that lists no command claim. */
  const commandRows = summary => (summary && Array.isArray(summary.commands) ? summary.commands.slice(0, 8) : [])
    .filter(row => row && typeof row === "object" && typeof row.id === "string" && /^[a-z0-9][a-z0-9-]{0,39}$/.test(row.id));
  function commandLines(summary) {
    const outcomes = {passed: T("within the allowed difference"), slower: T("worse than allowed"), error: T("raised an error"),
      timed_out: T("timed out"), inconclusive: T("inconclusive")};
    const code = value => typeof value === "string" && CODE.test(value) ? value : "";
    const words = value => Object.hasOwn(COMMAND_REASONS, value) ? T(COMMAND_REASONS[value])
      : Object.hasOwn(COMMAND_OUTCOMES, value) ? T(COMMAND_OUTCOMES[value]) : value.replaceAll("_", " ");
    const figure = value => typeof value === "number" && Number.isFinite(value) ? String(Math.round(value * 1000) / 1000) : "?";
    const has = value => typeof value === "number" && Number.isFinite(value);
    const lines = [];
    for (const row of commandRows(summary)) {
      const numbers = (Array.isArray(row.numbers) ? row.numbers : []).slice(0, 9)
        .filter(number => number && typeof number === "object" && typeof number.name === "string" && /^[a-z][a-z0-9_]{0,39}$/.test(number.name));
      if (row.status !== "measured" || !numbers.length) {
        const why = words(code(row.reason));
        lines.push({label: row.id + " · " + (why ? T("not measured: {reason}", {reason: why}) : T("not measured")), status: "notrun"});
        continue;
      }
      for (const number of numbers) {
        const name = row.id + " · " + number.name + " (" + (number.direction === "higher" ? T("higher is better") : T("lower is better")) + ")";
        const why = words(code(number.reason)), criterion = number.criterion === true;
        const spread = has(number.spread_percent) ? T("the original's repeats differ by {spread}% (a criterion may by {allowed}%)",
          {spread: figure(number.spread_percent), allowed: figure(number.max_spread_percent)}) : "";
        const aside = criterion ? "" : why ? T("no criterion: {reason}", {reason: why}) : T("no criterion");
        if (row.compared === true && has(number.original) && has(number.candidate)) {
          const worse = !has(number.slower_percent) ? "" : number.slower_percent > 0
            ? T("{percent}% worse (allowed {allowed}%)", {percent: figure(number.slower_percent), allowed: figure(number.tolerance_percent)})
            : T("{percent}% better", {percent: figure(-number.slower_percent)});
          const verdict = !criterion ? aside : Object.hasOwn(outcomes, number.status)
            ? outcomes[number.status] + (why && ["inconclusive", "error"].includes(number.status) ? T(": {reason}", {reason: why}) : "") : "";
          lines.push({label: [name, T("original {original}, candidate {candidate}", {original: figure(number.original), candidate: figure(number.candidate)}),
            worse, spread, verdict].filter(Boolean).join(" · "), status: !criterion ? "skipped" : number.status === "passed" ? "done" : "gap"});
        } else {
          const frozen = has(number.original) ? T("original {original} when the contract was frozen", {original: figure(number.original)}) : "";
          const verdict = !criterion ? aside : row.compared !== true
            ? (code(row.uncompared) ? T("the delivered code was not measured against it: {reason}", {reason: words(code(row.uncompared))})
              : T("the delivered code was not measured against it"))
            : Object.hasOwn(outcomes, number.status) ? outcomes[number.status] + (why ? T(": {reason}", {reason: why}) : "") : "";
          lines.push({label: [name, frozen, spread, verdict].filter(Boolean).join(" · "),
            status: !criterion || row.compared !== true ? "notrun" : number.status === "passed" ? "done" : "gap"});
        }

  }
  /* Which phase of the newest round the live job is in (only meaningful while running). */
  function livePhase(m) { return m.job && !m.terminal ? m.job.phase || "" : ""; }

  /* Sub-steps, gates and decisions of one stage, with live status, for the detail panel. */
  // The controls the job record offers (execution.ExecutionController.status); the review service decides again.
  function jobActions(job) {
    const labels = {cancel: T("Cancel run"), resume: T("Resume from the last checkpoint"), cleanup: T("Retry cleanup")};
    return (job.actions || []).map(action => ({
      label: labels[action], path: "/api/jobs/" + job.job_id + "/" + action,
      body: {operation_contract_digest: job.operation_contract_digest},
      // Only a job with a checkpoint is resumed, and it has none before its contract is sealed: the question says both.
      ...(action === "cancel" ? {confirm: T("Cancel this run? A run cancelled after its contract was sealed can be resumed later from its last checkpoint; one cancelled during its freeze cannot, and starts again as a new job.")} : {})}));
  }
  // What a job that ended without a result says of its end: its record's error, in the job's own words. One end
  // has the page's words, in the page's language: a worker stopped in the freeze (the record's ``interrupted``,
  // execution.FREEZE_INTERRUPTED), which no resume continues. Before, the page said of it what the record said of
  // any worker that is gone, and offered nothing that told the owner to start again.
  function endedText(job) {
    return job.interrupted === "freeze" ? T("Interrupted during the freeze: the job's worker stopped before the contract was sealed. An interrupted freeze cannot be resumed (the job has no checkpoint yet); start a new job.") : job.error || "";
  }
  // Why a paused job waits (job.pause, execution._pause), for the stage it stopped in.
  function pauseText(job) {
    const pause = job.pause || {};
    return pause.reason === "awaiting_clarification"
      // Where the page can take the answer itself (the job's review serves: its controls are offered), it says so first.
      ? (job.actions || []).length
        ? T("Paused: the controller waits for the owner's answer to {ids}. Answer below (or with nanolize job-answer), then resume the job.", {ids: (pause.awaiting || []).join(", ")})
        : T("Paused: the controller waits for the owner's answer to {ids} (nanolize job-answer). Resume the job after answering.", {ids: (pause.awaiting || []).join(", ")})
      : pause.reason === "awaiting_authorization"
      ? T("Paused: the controller waits for the owner to authorize {ids} (nanolize job-authorize). Resume the job after authorizing.", {ids: (pause.awaiting || []).join(", ")})
      : pause.reason === "owner_hold" ? T("Paused for the owner between two steps. Resume the job to continue.")
      : pause.reason === "budget_exhausted" ? T("Paused: the job's run time is spent and no accepted candidate can be delivered. Add run time to continue (nanolize job-resume --add-seconds N); the job's last event says what else it can do.")
      : pause.reason === "token_budget_exhausted" ? T("Paused: the owner's token limit is spent and no accepted candidate can be delivered. Add tokens to continue (nanolize job-resume --add-tokens N); the job's last event says what else it can do.")
      : pause.reason === "check_executor_unavailable" ? T("Paused: this job's checks cannot be run where they are to run (a compute node that cannot be used, or a machine without the GPUs they ask for). The job's last event says what its owner can do.")
      : pause.reason === "checks_unrunnable" ? T("Paused: some of this job's checks need a GPU and none can be used here. Exclude them (nanolize job-resume --exclude-unrunnable) or resume where a GPU is available.")
      : pause.reason === "original_changed" ? T("Paused: what the original's checks read changed while the job's first baseline was captured, and nothing of that capture was kept. Resume the job once the cause is gone: its baseline is captured again. The job's last event says what changed.")
      : pause.reason === "runner_trial_failed" ? T("Paused: a runner of this job did not pass the trial call of the job's first step, before anything was prepared. Repair the runner or its settings, then resume the job: the trial is made again. The job's last event says which runner failed and how. If its only fault is that it reports no usage, a job started without the trial runs it as before, with its usage uncounted (nanolize review --no-runner-trial, or runner_trial=false).")
      : pause.reason === "controller_unavailable" ? T("Paused at a stop that only the job's controller may override (an original baseline that is no usable behavior oracle, or a comparison that saw frozen inputs change). Either its agent did not answer, or the stop came where no controller round is held: before the job's first full comparison, or in a draft job. Resume the job once the cause is gone: the agent is asked again, or the step is taken again. What the job has made so far is kept; its last event says which of the two it was.")

      // the run, and what it found stays on record for every comparison of a candidate.
      : pause.reason === "scope_failures" ? T("Paused in its freeze: one run of the scope baseline found more than a job goes on with by itself. Each finding is a check of a kept capability that the run newly shows failing on the original once what the selection removes is taken out, twice and the same way, and passing on the original unchanged; such a check is a finding also where the baseline's tree attributes no check. The job has called no author since. Either cancel it and start a job with a corrected selection (keep the capability, declare the dependency, move the file to a kept capability or carry it), or resume it: it goes on with what it found. A check that a candidate then fails only as the scope baseline shows it failing is never sent to an author, and a delivery carries it as a gap; where a kept file cannot be imported in the baseline's tree, no check is attributed to the scope and each stays its author's to make pass. The job's events say how many findings and for which capabilities; its scope-baseline.json names the checks with what each misses, the places in kept code that use a removed name, and the kept files that cannot be imported.")
      : T("Paused: the job waits for its owner.");
  }

  /* What a paused job needs from its owner, for the top of the page. The questions or revision

     may not be: the main job of a pair that waits for its owner's word on its scope baseline notes
     after it what became of its draft job, so its last event is that note. (A call by hand no longer
     says the note again: job_debug._still_waiting says the newest event of the pause that is no note,

  function pauseNeeds(view) {
    const job = view.job;
    if (!job || job.status !== "paused") return [];
    const pause = job.pause || {}, ledger = (view.progress || {}).ledger || {}, awaited = new Set(pause.awaiting || []);
    // A question can be answered on the page while the job's review serves (its controls are then offered): what
    // the answer is sent with. A revision request is authorized by its owner's command, never from a page.
    const open = (rows, label, text) => (rows || []).filter(row => row.waiting || awaited.has(row.id))
      .map(row => ({label: T(label, {id: row.id || "?"}), text: row[text] || "", ...(text === "question" && (job.actions || []).length && row.id
        ? {ask: {path: "/api/jobs/" + job.job_id + "/answer", id: row.id,

    if (pause.reason === "awaiting_clarification" || pause.reason === "awaiting_authorization") {
      const asked = pause.reason === "awaiting_clarification" ? open(ledger.questions, "Question {id}", "question")
        : open(ledger.revisions, "Revision request {id}", "reason");
      if (asked.length) return asked;
    }
    if (pause.reason === "owner_hold") return [];  // the owner paused it: nothing stopped the job
    const last = (job.events || [])[(job.events || []).length - 1];
    const said = last && last.message ? [{label: T("The job's last event"), text: last.message}] : [];
    const found = pause.reason === "scope_failures" ? scopeBaselineItem(((view.progress || {}).freeze || {}).scope_baseline) : null;
    return found ? [{label: found.label, text: found.value}, ...said] : said;
  }

  /* ------------------------------ kept code, what an edition leaves out, a pair on one machine ------------------------------
     What a delivery says of the code it holds as the original's (the manifest's carry, and what the job kept
     because nothing on this machine verifies it), of the capabilities this edition does not include, of what
     its size figures are made of, and of a pair whose two jobs ran on one machine. A result is the job's own
     record, passed on as it is, and a job that ran before these fields were written has none of them: every
     reader below takes what has its form and leaves the rest out, so a block whose data is absent is absent
     and such a job's page is what it was. */
  const dict = value => value && typeof value === "object" && !Array.isArray(value) ? value : {};
  const records = value => (Array.isArray(value) ? value : []).filter(entry => entry && typeof entry === "object" && !Array.isArray(entry));
  const strings = value => (Array.isArray(value) ? value : []).filter(text => typeof text === "string" && text);
  const amount = value => typeof value === "number" && Number.isSafeInteger(value) && value >= 0 ? value : null;
  // The first of a list as a line says them, and how many more there are (as the page cuts its other lists).
  const some = (list, limit = 20) => [...list.slice(0, limit), ...(list.length > limit ? [T("+{n} more", {n: list.length - limit})] : [])].join(", ");
  const capabilityCount = n => n === 1 ? T("1 capability") : T("{n} capabilities", {n});
  const tokenCount = n => T("{tokens} tokens", {tokens: tokens(n)});
  // A code of the job's records in words: the page's own where it has them, else the code with spaces.
  const codeWords = (table, value) => typeof value !== "string" || !CODE.test(value) ? ""
    : Object.hasOwn(table, value) ? T(table[value]) : value.replaceAll("_", " ");
  /* Why a capability is kept as the original's or left out of an edition (the manifest's carried_capabilities

     capability that would have been left out and that kept code imports has a row of its own, whatever left
     it unverified. Files have reasons that no capability has, where a record counts them by reason: "data" is
     the pure data tables a conversion carries without being asked (data_table), "files" a carried file that
     belongs to no capability declared as carried (file_choice: a table, a resource, a path its owner named).
     "unstated" is a kept capability no record gives a reason for (a manifest that lists files to carry and
     declares no capability). The review page holds the same tables (planner.js), and a test holds the two equal. */
  const KEEP_GROUPS = {owner_choice: "chosen", kept_by_rule: "rule", data_table: "data", file_choice: "files", not_importable: "environment",
    original_check_failed: "environment", no_case_on_original: "environment", needs_gpu: "hardware", all_cases_skipped: "hardware",
    skipped_for_missing_package: "environment", cause_not_readable: "environment", gpu_not_in_time: "environment",
    check_stopped: "environment",
    gpus_beyond_node: "hardware", compiled_code: "no_valid_test", no_valid_test: "no_valid_test", needed_by_kept: "needed_by_kept"};
  const KEEP_GROUP_LABELS = {chosen: "You named it", rule: "By the rule", data: "Data tables", files: "Single files", environment: "The environment",
    hardware: "No such hardware on this machine", no_valid_test: "No valid test", needed_by_kept: "Kept code needs it",
    unstated: "No reason recorded"};
  const KEEP_REASONS = {owner_choice: "named in carry=", kept_by_rule: "device kernel code that carry=auto found",
    not_importable: "a module of it does not import here", original_check_failed: "its check fails on the original",
    no_case_on_original: "its check ran no case on the original", needs_gpu: "it needs a GPU that cannot be had",
    all_cases_skipped: "every test case of it is skipped on this machine",
    skipped_for_missing_package: "its test cases are all skipped: a package is not installed",
    cause_not_readable: "its test cases are all skipped and the cause cannot be read",
    gpu_not_in_time: "its GPU batch did not start in time (the queue was busy)",
    check_stopped: "its check was stopped by another process on both of its starts",
    gpus_beyond_node: "its checks ask for more GPUs than this machine or any node has",
    compiled_code: "compiled code that no knockout reaches", no_valid_test: "no valid test when the freeze ended",
    needed_by_kept: "kept code imports it"};

  /* What a delivery holds as the original's, byte for byte (result.carried_files, and of the capabilities
     without a valid test result.untested_capabilities), group by group: the capabilities of each, and its
     files and tokens where the record counts them by reason (carried_files.by_reason). ``verified`` and
     ``unverified``: how many of the kept capabilities a valid test verifies (one the owner named or the rule
     found still gets its tests) and how many none does. ``loose``: the kept files that belong to no declared
     capability. ``leftOut``: the files the manifest lists to keep that went with capabilities the selection
     leaves out (carried_files.left_out), which the delivery does not hold. null for a delivery that holds
     nothing so. */
  function keptView(result) {
    const carried = dict(result.carried_files), untested = dict(result.untested_capabilities), cause = dict(untested.by_cause);
    // Kept and verified by no valid test: what the job found so at its seal, and what it kept by itself when its freeze ended.
    const blind = new Set([...strings(untested.carried), ...strings(untested.carried_in_freeze)]);
    const groupOf = new Map(), sized = new Map();
    const place = (id, group) => { if (!groupOf.has(id)) groupOf.set(id, group); };
    for (const id of strings(untested.needed_by_kept)) place(id, "needed_by_kept");
    for (const entry of records(carried.capabilities)) if (typeof entry.capability === "string" && entry.capability) place(entry.capability, keepGroup(entry));
    // Kept because a process stopped a check of theirs twice (check_stopped): nothing is to be repaired for them.
    const stopped = new Set([...records(carried.capabilities).filter(entry => entry.reason === "check_stopped").map(entry => entry.capability),
      ...strings(dict(dict(carried.by_reason).check_stopped).capabilities)]);
    for (const id of strings(carried.by_rule)) place(id, "rule");
    for (const [reason, said] of Object.entries(dict(carried.by_reason))) {
      const group = keepGroup({reason, group: reason});
      if (group === "unstated" || !said || typeof said !== "object") continue;
      const held = sized.get(group) || {};
      for (const key of ["files", "tokens"]) if (amount(said[key]) != null) held[key] = (held[key] || 0) + said[key];
      sized.set(group, held);
      for (const id of strings(said.capabilities)) place(id, group);
    }
    // What the job kept by itself has no declaration in the reviewed manifest: its cause is the job's own word.
    for (const group of ["environment", "hardware", "no_valid_test"]) for (const id of strings(cause[group])) if (blind.has(id)) place(id, group);
    for (const id of blind) place(id, "unstated");
    const parts = dict(dict(result.size_parts).carried), all = dict(result.repository_size);
    // (A conversion's report lists the carried files where a delivery counts them: either is their number.)
    const files = (Array.isArray(carried.files) ? carried.files.length : amount(carried.files)) ?? amount(parts.files) ?? amount(all.carried_files);
    if (!groupOf.size && !files) return null;
    const groups = Object.keys(KEEP_GROUP_LABELS).map(group => ({group, ids: [...groupOf].filter(([, at]) => at === group).map(([id]) => id),
      files: (sized.get(group) || {}).files ?? null, tokens: (sized.get(group) || {}).tokens ?? null}))
      .filter(row => row.ids.length || row.files || row.tokens)
      .map(row => row.group === "environment" && row.ids.length && row.ids.every(id => stopped.has(id)) ? {...row, rerun: true} : row);
    const unverified = [...groupOf.keys()].filter(id => blind.has(id)).length;
    return {capabilities: groupOf.size, verified: groupOf.size - unverified, unverified, files,
      tokens: amount(carried.tokens) ?? amount(parts.tokens) ?? amount(all.carried_tokens), groups, loose: amount(carried.files_without_reason) || 0,
      // The files the manifest keeps that are not in this delivery: they went with capabilities the selection leaves out.
      leftOut: amount(dict(carried.left_out).files) || 0, leftOutTokens: amount(dict(carried.left_out).tokens),
      // What the job kept without a decision when its freeze ended (untested_capabilities.undecided): nothing was
      // found that needs it, and that many checks that stay do not say what they need. Apart from "kept code needs it".
      undecided: strings(untested.undecided), undecidedChecks: amount(untested.undecided_checks) || 0};
  }
  const keptUndecided = kept => !kept.undecided.length ? "" : T("Kept without a decision: {names}", {names: some(kept.undecided)}) + " — "
    + T("nothing was found that needs them; checks that stay and do not say what they need: {n}", {n: kept.undecidedChecks});
  // One group of kept code in a line: its name, its capabilities, its files and tokens, and for what the
  // environment left unverified what its owner can do about it.
  const keptGroupLine = row => [T(KEEP_GROUP_LABELS[row.group]) + (row.ids.length ? T(": {names}", {names: some(row.ids)}) : ""),
    row.files != null ? plural(row.files, "file") : "", row.tokens != null ? tokenCount(row.tokens) : ""].filter(Boolean).join(" · ")
    + (row.group !== "environment" ? "" : " — " + (row.rerun ? T("run again: another process stopped their checks, and nothing is to be repaired")
      : T("repair the test environment and run again")));
  const keptTotals = kept => [kept.capabilities ? capabilityCount(kept.capabilities) : "", kept.files != null ? plural(kept.files, "file") : "",
    kept.tokens != null ? tokenCount(kept.tokens) : ""].filter(Boolean).join(" · ");
  const keptChecked = kept => !kept.capabilities ? "" : !kept.unverified ? T("each of them verified by a check")
    : !kept.verified ? T("none of them verified by a check on this machine")
    : T("{verified} of them verified by a check, {unverified} by none", {verified: kept.verified, unverified: kept.unverified});
  /* Whether the job counted kept code as no gap of its delivery. A job that says what its size is made of
     (result.size_parts) ran under that rule, and a delivery that succeeded has no gap at all; one made before
     the rule may have recorded a kept capability without a valid test as a gap, and the page does not say of
     such a record what the record itself contradicts. */
  const keptIsNoGap = job => job.status === "succeeded" || Boolean(job.result && job.result.size_parts && typeof job.result.size_parts === "object");

  /* The capabilities a delivery does not include because nothing on this machine can verify them
     (result.dropped_capabilities; a result that only names them, under untested_capabilities.dropped, has
     their ids): each with its reason, whether the host left it out before Submit or the job when its freeze
     ended, and its files and tokens. ``tokens``: all of them together, as the size's parts say it, else the
     sum where every row has a number. null for a delivery that leaves none out. */
  function droppedView(result) {
    const listed = records(result.dropped_capabilities).filter(entry => typeof entry.capability === "string" && entry.capability);
    const found = listed.length ? listed : strings(dict(result.untested_capabilities).dropped).map(capability => ({capability}));
    if (!found.length) return null;
    const sum = key => found.every(entry => amount(entry[key]) != null) ? found.reduce((total, entry) => total + entry[key], 0) : null;
    return {rows: found.map(entry => ({id: entry.capability, group: keepGroup(entry), reason: codeWords(KEEP_REASONS, entry.reason),
        when: ["before_submit", "freeze"].includes(entry.when) ? entry.when : null, files: amount(entry.files), tokens: amount(entry.tokens)})),
      tokens: amount(dict(dict(result.size_parts).dropped).tokens) ?? sum("tokens"), files: sum("files")};
  }
  /* What stands first under the status of a run that delivered an edition without some of its capabilities:
     which, why, and what to type to keep them. null for every other run. */
  function droppedNote(view) {
    const job = view.job;
    if (!job || !["succeeded", "completed_with_gaps", "delivered_with_failures"].includes(job.status)) return null;
    const dropped = droppedView(dict(job.result));
    return dropped ? {text: T("Not in this edition: {names} (cannot be verified on this machine).", {names: some(dropped.rows.map(row => row.id))}),
      how: T("To keep them, write untested=keep or put their paths into carry=.")} : null;
  }

  /* What a delivery's tokens are made of (result.size_parts), part by part: what authors rewrote smaller, which
     alone is compression; what went with capabilities the edition does not include; what is kept as the
     original's and counts on neither side. Each part with its words for a line and, for the detail, what it
     means. [] for a result without the parts; a part whose numbers are missing is left out. */
  function sizeParts(result) {
    const parts = dict(result.size_parts), rewritten = dict(parts.rewritten), dropped = dict(parts.dropped), carried = dict(parts.carried), out = [];
    const before = amount(rewritten.original_tokens), after = amount(rewritten.delivered_tokens);
    if (before != null && after != null) out.push({part: "rewritten", means: T("what authors rewrote smaller: this is the compression"),
      text: after <= before ? T("rewritten smaller: {saved} tokens fewer ({before} → {after})", {saved: tokens(before - after), before: tokens(before), after: tokens(after)})
        : T("rewritten larger: {added} tokens more ({before} → {after})", {added: tokens(after - before), before: tokens(before), after: tokens(after)})});
    const gone = Array.isArray(dropped.capabilities) ? dropped.capabilities.length : amount(dropped.capabilities);
    if (amount(dropped.tokens) != null) out.push({part: "dropped", means: T("gone with capabilities this edition does not include: not compression"),
      text: T("not in this edition: {tokens} tokens", {tokens: tokens(dropped.tokens)}) + (gone ? " (" + capabilityCount(gone) + ")" : "")});
    if (amount(carried.tokens) != null) out.push({part: "carried", means: T("in the original and in the delivery alike, outside the ratio"),
      text: T("kept as the original's: {tokens} tokens", {tokens: tokens(carried.tokens)}) + (amount(carried.files) ? " (" + plural(carried.files, "file") + ")" : "")});
    return out;
  }
  /* A delivery's size as the top of the page says it. The job's own figure (result.size: what authors wrote
     against the original of it) stands alone, as it always did, where the delivery holds nothing as the
     original's. Where it does, the whole repository's figure (result.repository_size, the kept files on both
     sides) stands beside it and each says which it is: the first number alone was read as the second. After
     them, what the tokens are made of, where the result says it: code that left with a capability must not
     read as compression. */
  function sizeFacts(result) {
    const size = dict(result.size), all = dict(result.repository_size), parts = sizeParts(result), facts = [];
    const figure = said => T("{tokens} tokens · {percent}% of the original's {baseline}", {tokens: tokens(said.total_tokens),
      percent: Math.round(said.retained_percent * 10) / 10, baseline: tokens(said.baseline_tokens)});
    const both = ["total_tokens", "baseline_tokens", "retained_percent"].every(key => typeof all[key] === "number" && Number.isFinite(all[key]));
    if (size.total_tokens != null && size.baseline_tokens != null && size.retained_percent != null)
      facts.push(both ? {label: T("Rewritten part"), value: figure(size), note: T("the job's own figure: the kept files count on neither side")}
        : {label: T("Size"), value: figure(size)});
    // The base is the whole original (the review's "can shrink to" is of what the selection holds): said beside it.
    if (both) facts.push({label: T("Whole repository"), value: figure(all), note: T("of the whole original, kept files counted on both sides")});
    if (parts.length) facts.push({label: T("Where the tokens went"), value: parts.map(part => part.text).join(" · "),
      note: T("only what was rewritten smaller is compression")});
    return facts;
  }

  /* A pair whose two jobs run on one machine (a local pair: pair on where no scheduler is installed), as the
     job's records say it: the delivery's result.pair once there is one, before it the job's public pair record
     (job.pair) and its events by their codes (local_pair, processes_isolated or processes_by_instruction,
     check_rerun_after_signal, beside_draft_job, session_commands_read). ``processes``: "isolated" (every
     session in a process space of its own) or "by_instruction" (every session told in its prompt to leave
     other processes alone), null while no record says which. ``commands``: what reading the sessions'
     commands found, null until they are read (when the job delivers): how many sessions and commands were
     read, and by kind (listing or inspecting processes, stopping them by name or pattern, signalling a process
     id) which session of which job and role ran how many of which rule (the result names no command's text:
     that is in the job's own record), with what could not be read. ``said``: the job's own words for what only
     an event tells yet. null for every other job. */
  function pairView(view) {
    const job = view.job;
    if (!job) return null;
    const result = dict(dict(job.result).pair), named = dict(job.pair), told = new Map();
    for (const event of records(job.events)) for (const code of strings(event.codes))
      told.set(code, [...(told.get(code) || []), typeof event.message === "string" ? event.message : ""]);
    if (result.place !== "here" && named.place !== "here" && !told.has("local_pair")) return null;
    const modes = ["isolated", "by_instruction"];
    const processes = modes.find(mode => mode === result.processes) || modes.find(mode => mode === named.processes)
      || (told.has("processes_isolated") ? "isolated" : told.has("processes_by_instruction") ? "by_instruction" : null);
    const clip = text => text.length > 300 ? text.slice(0, 300) + "…" : text;
    const text = value => typeof value === "string" && value ? clip(value) : "";
    // A row as a line: whose sessions they were (the job, the role, the session), what they ran (the rule that
    // names the kind of command, or a command itself where a record holds one), and how often.
    const row = entry => {
      if (typeof entry === "string" && entry) return {line: clip(entry), count: 1};
      const what = entry && typeof entry === "object" ? text(entry.command) || text(entry.rule) : "";
      if (!what) return null;
      const who = [Object.hasOwn(PAIR_JOBS, entry.job) ? T(PAIR_JOBS[entry.job]) : text(entry.job), text(entry.role), text(entry.session)].filter(Boolean).join(" · ");
      const times = amount(entry.count) ?? 1;
      return {line: [who, what].filter(Boolean).join(": ") + (times > 1 ? " ×" + times : ""), count: times};
    };
    const read = result.session_commands && typeof result.session_commands === "object" ? result.session_commands : null;
    // One kind of them: its rows, and how many commands they are. Where the result names more rows than it
    // lists (omitted), that is their least number (``more``): each row it left out is a command at least.
    const kind = name => {
      const found = (Array.isArray(read[name]) ? read[name] : []).map(row).filter(Boolean), left = amount(dict(read.omitted)[name]) || 0;
      return {lines: found.map(entry => entry.line), count: found.reduce((sum, entry) => sum + entry.count, 0) + left, more: left > 0};
    };
    const word = code => typeof code === "string" && CODE.test(code) ? code.replaceAll("_", " ") : "";
    return {processes, draft: [result.draft_job_id, named.partner_job_id].find(id => typeof id === "string" && id) || null,
      commands: read ? {sessions: amount(read.sessions), commands: amount(read.commands), looked: kind("list"),
        byName: kind("signal_by_name"), byId: kind("signal_by_id"), unread: strings(read.not_read).map(clip)} : null,
      // The gate decisions lost to time or to instability while the draft job worked beside this one, one a line.
      beside: Array.isArray(result.beside_draft) ? records(result.beside_draft).map(entry => [Object.hasOwn(PAIR_GATES, entry.gate) ? T(PAIR_GATES[entry.gate]) : word(entry.gate),
        text(entry.item), word(entry.reason)].filter(Boolean).join(" · ")).filter(Boolean) : null,
      reruns: (told.get("check_rerun_after_signal") || []).length,
      // Runs that a signal stopped and that were started once more (result.pair.second_runs), by job and by side.
      second: (() => {
        const found = dict(result.second_runs), side = (job, name) => amount(dict(found[job])[name]) || 0;
        const counts = {main: [side("main", "original"), side("main", "candidate")], draft: [side("draft", "original"), side("draft", "candidate")]};
        const lines = records(found.runs).map(entry => [Object.hasOwn(PAIR_JOBS, entry.job) ? T(PAIR_JOBS[entry.job]) : word(entry.job), word(entry.side),
          Object.hasOwn(PAIR_GATES, entry.gate) ? T(PAIR_GATES[entry.gate]) : word(entry.gate), text(entry.item),
          amount(entry.signal) != null ? T("signal {n}", {n: entry.signal}) : "", word(entry.second)].filter(Boolean).join(" · ")).filter(Boolean);
        return [...counts.main, ...counts.draft].some(Boolean) || lines.length ? {counts, lines, more: amount(found.omitted) || 0} : null;
      })(),
      // A session that was started outside the process space the record says (the event session_not_isolated).
      loose: (told.get("session_not_isolated") || []).filter(Boolean).map(clip),
      warnings: (Array.isArray(result.warnings) ? strings(result.warnings) : strings(named.warnings)).map(clip),
      said: {commands: (told.get("session_commands_read") || []).filter(Boolean).slice(-1)[0] || "",
        beside: (told.get("beside_draft_job") || []).filter(Boolean)}};
  }
  // The two jobs of a pair, and the gates of the main job that can lose a decision beside the draft job (result.pair.beside_draft).
  const PAIR_JOBS = {main: "main job", draft: "draft job"};
  const PAIR_GATES = {baseline: "the baseline", design: "the test design", performance: "the performance measurement", check: "a check's run"};
  /* The pair's item of a stage's detail (stage 03, where the two jobs work beside each other, and stage 06
     once the delivery says what its sessions' commands held). A line that needs its owner's eye is marked as
     a gap is (a session that stopped processes by name or pattern, a warning, a decision lost beside the
     draft job); nothing of it is a gap of the delivery, which the item's own state says. */
  function pairItem(view) {
    const pair = pairView(view);
    if (!pair) return null;
    const criteria = [], folds = [];
    if (pair.processes === "isolated") criteria.push({status: "done", label: T("Every session runs in a process space of its own: it cannot see the other job's processes")});
    if (pair.processes === "by_instruction") criteria.push({status: "skipped",
      label: T("Every session is told in its prompt not to look at or stop processes it did not start: an instruction, not a wall")});
    const read = pair.commands;
    if (read) {
      const counted = {sessions: read.sessions ?? "?", commands: read.commands ?? "?"};
      criteria.push(read.looked.count || read.byName.count || read.byId.count
        ? {status: read.byName.count ? "gap" : "skipped", label: T("Sessions' commands read (sessions: {sessions}, commands: {commands}): listing or inspecting processes: {looked}; stopping processes by name or pattern: {named}; signalling a process id: {own}",
            {...counted, looked: orMore(read.looked.count, read.looked.more), named: orMore(read.byName.count, read.byName.more), own: orMore(read.byId.count, read.byId.more)})}
        // (A clean answer only of what was read: where a record could not be read, or none was, the line is no check mark.)
        : {status: read.unread.length || !read.sessions ? "skipped" : "done",
           label: T("Sessions' commands read (sessions: {sessions}, commands: {commands}): none lists, inspects or signals processes", counted)});
      // What stopped processes by name or pattern stands in the open, a line a session: only that could have
      // reached the other job's processes. The other two kinds are a list the reader opens.
      for (const line of read.byName.lines.slice(0, 10)) criteria.push({status: "gap", label: T("stops by name or pattern") + ": " + line});
      const by = (lines, tag) => lines.map(line => tag + ": " + line);
      const rest = [...by(read.byName.lines.slice(10), T("stops by name or pattern")), ...by(read.byId.lines, T("signals a process id")),
        ...by(read.looked.lines, T("lists or inspects processes"))];
      if (rest.length) folds.push({key: "pair-commands", title: T("The sessions that listed, inspected or signalled processes · {n}", {n: rest.length}), lines: rest.slice(0, 200)});
      for (const line of read.unread.slice(0, 5)) criteria.push({status: "skipped", label: line});
    } else criteria.push(pair.said.commands ? {status: "skipped", label: pair.said.commands}
      : {status: "pending", label: T("Whether a session looked at or touched other processes is read once, when the job delivers")});
    if (pair.reruns) criteria.push({status: "skipped", label: T("Checks that ended by a signal and were run again once: {n}", {n: pair.reruns})});
    if (pair.second) {
      const [mainOriginal, mainCandidate] = pair.second.counts.main, [draftOriginal, draftCandidate] = pair.second.counts.draft;
      // A run of the candidate that only passed at its second start is the one to look at: the first may have been stopped by the other job.
      criteria.push({status: mainCandidate || draftCandidate ? "gap" : "skipped",
        label: T("Runs stopped by a signal and started once more: main job, original {a} / candidate {b}; draft job, original {c} / candidate {d}",
          {a: mainOriginal, b: mainCandidate, c: draftOriginal, d: draftCandidate})});
      if (pair.second.lines.length) folds.push({key: "pair-second", title: T("Runs started a second time · {n}", {n: pair.second.lines.length + pair.second.more}),
        lines: pair.second.lines.slice(0, 200)});
    }
    for (const line of pair.loose.slice(0, 5)) criteria.push({status: "gap", label: T("A session was not isolated as recorded") + ": " + line});
    const lost = pair.beside || pair.said.beside;
    if (pair.beside && !lost.length) criteria.push({status: "done", label: T("No gate decision was lost to time or to instability beside the draft job")});
    if (lost.length) {
      criteria.push({status: "gap", label: T("Gate decisions lost to time or to instability beside the draft job: {n}", {n: lost.length})});
      folds.push({key: "pair-beside", title: T("Lost beside the draft job · {n}", {n: lost.length}), lines: lost.slice(0, 200)});
    }
    for (const warning of pair.warnings.slice(0, 10)) criteria.push({status: "gap", label: warning});
    return item("note", T("Pair on this machine"), pair.processes === "isolated" ? "done" : "skipped", {stays: true, plain: true,
      value: [T("both jobs run on this machine"), pair.processes === "isolated" ? T("processes: each session in a process space of its own")
        : pair.processes === "by_instruction" ? T("processes: kept apart by an instruction in every session's prompt") : ""].filter(Boolean).join(" · "),
      tells: T("This job freezes the contract and verifies; the draft job writes the first implementation on a second copy at low priority and runs no check that declares GPUs. Each job's state, copy and temporary files are private paths"),
      rule: T("Where no scheduler is installed the two jobs of a pair run on this machine. Processes are separated where the machine can give each session a process space of its own; where it cannot, every session of both jobs is told to leave other processes alone, a check that ended by a signal is run again once before it counts, and the commands the sessions ran are read once when the job delivers. That reading is a report and never a gate"),
      criteria, ...(folds.length ? {folds} : {})});
  }

  /* What a delivery says beside its criteria of the code it kept, left out or could have kept, as items of
     stage 06, in the order a reader needs them: what this edition does not include; what its size figures are
     made of; what it holds as the original's, group by group; the pair on this machine; the names between kept
     files and rewritten code (result.carried_joins: only a name that stays missing is a gap); what a next run
     could keep (result.carry_suggestions, result.carry_candidates, each with the text to type); and what the
     delivery lacks against the original (result.lacks: a record for its reader, no gate). None of these but a
     broken join changes the delivery's status, and each stands by itself (``stays``): nothing else says it.
     They report and are no steps, so they carry no word of a step's state (``plain``: a kept capability is not
     "done", and one an edition leaves out is not a step that was "skipped"); the check of the names is judged,
     and says done or with gaps. */
  function deliveryNotes(view) {
    const job = view.job, result = dict(job && job.result), out = [];
    const dropped = droppedView(result);
    // A capability the manifest lists as not in this edition and the job's selection keeps (the event
    // dropped_capability_selected, of the job's first events): said where the page lists what is not in the edition.
    const still = (Array.isArray(job && job.events) ? job.events : []).filter(event => event && Array.isArray(event.codes)
      && event.codes.includes("dropped_capability_selected") && typeof event.message === "string").map(event => event.message.slice(0, 600));
    if (still.length) out.push(item("note", T("Listed as not in this edition, but selected"), "skipped", {stays: true, plain: true, value: still[0],
      tells: T("The selection keeps capabilities that the manifest lists as not in this edition: they are in it, and the job settles them when its freeze ends")}));
    if (dropped) out.push(item("note", T("Not in this edition"), "skipped", {stays: true, plain: true,
      value: [capabilityCount(dropped.rows.length), dropped.files != null ? plural(dropped.files, "file") : "", dropped.tokens != null ? tokenCount(dropped.tokens) : "",
        T("cannot be verified on this machine")].filter(Boolean).join(" · "),
      tells: T("To keep them, write untested=keep or put their paths into carry=."),
      rule: T("Capabilities that nothing on this machine can verify are left out under untested=drop, which is the default: no gap of the delivery, like a capability the review deselects, and their tokens are no compression. A capability that kept code imports is never left out, nor is a path under carry="),
      criteria: [...dropped.rows.slice(0, 40).map(row => ({status: "skipped", label: [row.id + " — " + (row.reason || T(KEEP_GROUP_LABELS[row.group])),
          row.when === "before_submit" ? T("left out before Submit") : row.when === "freeze" ? T("left out when the freeze ended") : "",
          row.files != null ? plural(row.files, "file") : "", row.tokens != null ? tokenCount(row.tokens) : ""].filter(Boolean).join(" · ")})),
        ...(dropped.rows.length > 40 ? [{status: "skipped", label: T("+{n} more", {n: dropped.rows.length - 40})}] : [])]}));
    const sizes = sizeFacts(result), parts = sizeParts(result);
    if (sizes.length > 1) out.push(item("note", T("Size, part by part"), "done", {stays: true, plain: true,
      value: sizes.filter(fact => fact.label !== T("Where the tokens went")).map(fact => T("{title}: {status}", {title: fact.label, status: fact.value})).join(" · "),
      rule: T("The rewritten part's figure is the job's own: what authors wrote against the original of it, with the kept files on neither side. The whole repository's figure counts the kept files on both sides. Tokens that went with a capability this edition does not include are no compression"),
      ...(parts.length ? {criteria: parts.map(part => ({status: "done", label: part.text + " — " + part.means}))} : {})}));
    const kept = keptView(result);
    if (kept) out.push(item("note", T("Kept as the original's"), "done", {stays: true, plain: true,
      value: [keptTotals(kept), keptChecked(kept), keptIsNoGap(job) ? T("no gap of the delivery") : ""].filter(Boolean).join(" · "),
      rule: T("The original's files, byte for byte: no author writes them, and neither side of the rewritten part's figure counts them. Kept code is reported here and is no gap of a delivery, whatever it is kept for; a name that a kept file imports from rewritten code and that is gone is one"),
      criteria: [...kept.groups.map(row => ({status: ["chosen", "rule"].includes(row.group) ? "done" : "skipped", label: keptGroupLine(row)})),
        ...(kept.undecided.length ? [{status: "skipped", label: keptUndecided(kept)}] : []),
        ...(kept.loose ? [{status: "skipped", label: T("kept files of no declared capability (a data table, a resource): {n}", {n: kept.loose})}] : []),
        ...(kept.leftOut ? [{status: "skipped", label: T("files the manifest lists to keep that went with capabilities the selection leaves out: {n}", {n: kept.leftOut})
          + (kept.leftOutTokens != null ? " · " + T("{n} tokens", {n: kept.leftOutTokens.toLocaleString("en-US")}) : "")}] : [])]}));
    if (dict(result.pair).place === "here") { const pair = pairItem(view); if (pair) out.push(pair); }
    const joins = joinsItem(result);
    if (joins) out.push(joins);
    const typed = paths => "carry=" + paths.join(",");
    const every = records(result.carry_suggestions).map(entry => ({id: typeof entry.capability === "string" ? entry.capability : "", paths: strings(entry.paths),
      why: codeWords(CARRY_WHY, entry.why), more: amount(entry.more) || 0, criteria: strings(entry.criteria).length}));
    const suggested = every.filter(entry => entry.paths.length);
    // The stop rule's entry for criteria that name no capability (numbers of the project's own benchmark command):
    // it has no path, and was dropped here without a word.
    const pathless = every.filter(entry => !entry.paths.length && !entry.id && entry.criteria).reduce((sum, entry) => sum + entry.criteria, 0);
    if (suggested.length || pathless) out.push(item("note", T("Keep next time"), "skipped", {stays: true, plain: true,
      value: suggested.length ? typed([...new Set(suggested.flatMap(entry => entry.paths))]) : T("no path can be named"),
      tells: T("Add these paths to carry= for the next run: the job could not make this code work rewritten"),
      criteria: [...suggested.slice(0, 20).map(entry => ({status: "skipped", label: [entry.id, entry.why, typed(entry.paths)
          + (entry.more ? " " + T("+{n} more", {n: entry.more}) : "")].filter(Boolean).join(" — ")})),
        ...(pathless ? [{status: "skipped", label: T("{n} failed performance criteria name no capability (numbers of the project's own benchmark command): no path can be named for them", {n: pathless})}] : [])]}));
    const candidates = carryCandidates(result);
    // The list is missing, not empty (result.carry_candidates_unavailable: the rule gave no answer, and why).
    const unlisted = typeof result.carry_candidates_unavailable === "string" ? result.carry_candidates_unavailable : "";
    if (unlisted && !candidates) out.push(item("note", T("Candidates to keep"), "skipped", {stays: true, plain: true,
      value: T("the list could not be made: {why}", {why: unlisted === "time_limit" ? T("the rule did not finish in its time")
        : unlisted === "not_read" ? T("the tree could not be read") : unlisted.slice(0, 80)})}));
    if (candidates) out.push(item("note", T("Candidates to keep"), "skipped", {stays: true, plain: true,
      value: [candidates.rule.length ? T("carry=auto would keep: {what}", {what: candidates.total(candidates.rule)}) : "",
        candidates.other.length ? T("other compiled code: {what}", {what: candidates.total(candidates.other)}) : "",
        candidates.tables.length ? T("data tables: {what}", {what: candidates.total(candidates.tables)}) : ""].filter(Boolean).join(" · "),
      tells: T("Not kept in this run. To keep any of it next time, type the text of its row"),
      rule: T("What carry=auto would keep (device kernel code), the other compiled code and the data tables that are not kept unasked, as far as this delivery does not hold them as the original's: an author rewrote them, or they left with their capability"),
      criteria: [...candidates.rule, ...candidates.other, ...candidates.tables].slice(0, 40).map(row => ({status: "skipped", label: row.text}))}));
    const lacks = lacksView(result);
    if (lacks) out.push(item("note", T("What this delivery lacks against the original"), "skipped", {stays: true, plain: true, value: lacks.value,
      tells: [T("A static record for its reader, made from the two trees: no gate, and no author sees it"), lacks.note].filter(Boolean).join(" · "),
      // The one line that is no reminder: a name the contract names and the delivery does not have.
      ...(lacks.contract ? {criteria: [{status: "gap", label: T("Names the contract names that the delivery does not have: {n}", {n: lacks.contract})}]} : {}),
      ...(lacks.lists.some(list => list.lines.length) ? {folds: lacks.lists.filter(list => list.lines.length).map(list => ({key: "lacks-" + list.field,
        title: [T("{title}: {status}", {title: list.label, status: list.count}), list.means].filter(Boolean).join(" · "), lines: list.lines}))} : {})}));
    return out;
  }
  /* The static check of the names that kept files import from rewritten code, as a delivery says it
     (result.carried_joins): how many kept files and names were read, the names that are missing in the
     delivered code (the first of them, and how many there are), how many an author repaired, and how the check
     stands. A name that stays missing is a gap of the delivery, the one thing of kept code that is. Beside it,
     where a kept source is one a compiler reads, whether the build definitions' compile options differ from
     the original's (compile_options): a hint, since the kept bytes are the original's and what compiles them
     may be an author's. null for a result without the record. */
  const JOIN_STATUS = {passed: "every name read is there", failed: "names are missing", not_checked: "nothing was checked",
    undecided: "not every name could be decided"};
  function joinsItem(result) {
    const joins = result.carried_joins && typeof result.carried_joins === "object" ? result.carried_joins : null;
    if (!joins) return null;
    const missing = records(joins.missing), total = Math.max(amount(joins.missing_total) || 0, missing.length);
    const repaired = Array.isArray(joins.repaired) ? joins.repaired.length : amount(joins.repaired), options = dict(joins.compile_options);
    const part = text => typeof text === "string" && text ? text : "?", marks = list => some(strings(list).map(mark => mark.slice(0, 80)), 8);
    const read = "checked_files" in joins || "missing" in joins;
    // A row that is the selection's doing (left_out: the module is of a capability the selection leaves out) says so.
    const aside = entry => entry.left_out === true ? " (" + T("of a capability the selection leaves out: no author writes it") + ")" : "";
    const criteria = [...missing.slice(0, 20).map(entry => ({status: "gap", label: (typeof entry.name === "string" && entry.name
        ? T("{file} imports {name} from {source}, which no longer defines it", {file: part(entry.carried_file), name: entry.name, source: part(entry.imports_from)})
        : T("{file} imports {source}, which is not there", {file: part(entry.carried_file), source: part(entry.imports_from)})) + aside(entry)})),
      ...(total > 20 ? [{status: "gap", label: T("+{n} more", {n: total - Math.min(20, missing.length)})}] : []),
      // A hint and no gap (the job's own words for it): a comparison of words in the build files both trees hold.
      ...(options.status === "differ" ? [{status: "skipped", label: [T("A hint, no gap") + ": " + T("The build definitions' compile options differ from the original's"),
        strings(options.only_in_original).length ? T("only in the original: {marks}", {marks: marks(options.only_in_original)}) : "",
        strings(options.only_in_delivery).length ? T("only in the delivery: {marks}", {marks: marks(options.only_in_delivery)}) : ""].filter(Boolean).join(" · ")}] : []),
      // How many kept Python files could not be read (the job's count); an earlier form listed sentences.
      ...(amount(joins.not_read) ? [{status: "skipped", label: T("kept Python files that could not be read: {n}", {n: joins.not_read})}] : []),
      ...strings(joins.not_read).slice(0, 5).map(line => ({status: "skipped", label: line.slice(0, 300)}))];
    // Names the check could not decide are neither found nor missing: the item is no gap and not done, and it
    // does not say "no name missing" of names it did not decide (also of a record that still says passed).
    const open = amount(joins.undecided) || 0;
    return item("note", T("Names between kept files and rewritten code"), total ? "gap"
      : !read || joins.status === "not_checked" || amount(joins.checked_files) === 0 || open || joins.status === "undecided" ? "skipped" : "done", {stays: true,
      value: [amount(joins.checked_files) != null ? T("kept files checked: {n}", {n: joins.checked_files}) : "", amount(joins.imports) != null ? T("names read: {n}", {n: joins.imports}) : "",
        !read ? "" : total ? T("names missing in rewritten files: {n}", {n: total})
          : open || joins.status === "undecided" ? T("no name missing among those that could be decided") : T("no name missing"),
        // The names the check could not decide (a module that may bind names in a way it does not follow): neither.
        amount(joins.undecided) ? T("undecided: {n}", {n: joins.undecided}) : "",
        repaired ? T("repaired by an author: {n}", {n: repaired}) : "",
        codeWords(JOIN_STATUS, joins.status === "passed" && open ? "undecided" : joins.status)].filter(Boolean).join(" · "),
      tells: T("The kept files are the same byte for byte and their names were checked; their behavior beside the rewritten code is not verified on this machine"),
      rule: T("Every name a kept file imports from a rewritten file has to exist there. The check reads the plan's import table and imports or runs nothing, so it also reaches code this machine cannot load. It does not see a name used as an attribute, an import built at run time, or how the two behave together. A name that stays missing is a gap of the delivery; a kept file is never changed"),
      ...(criteria.length ? {criteria} : {})});
  }
  // Why the job's stop rule names a path to keep next time (result.carry_suggestions).
  const CARRY_WHY = {preparation_failed_twice: "its preparation failed twice", performance_still_failed: "its performance still failed after the repairs"};
  // What kind of code a candidate to keep is (result.carry_candidates).
  const CARRY_KINDS = {device_kernel: "device kernel code", compiled: "compiled code without device source", processor_kernel: "kernel code for the processor",
    hinted: "under a decorator of a library that may compile kernels", data_table: "a data table"};
  /* What a delivery could have kept as the original's and did not (result.carry_candidates, the conversion's
     list): what carry=auto would keep (``rule``) apart from the other compiled code (``other``: compiled
     extensions without device source, kernels for the processor, files under a decorator the rule only hints
     at) and from the data tables that are not carried unasked (``tables``), each row with its paths, files,
     tokens and kind, whether its capability is not in this edition, and the exact text to type to keep it (its
     ``paths`` are what is typed after carry=). ``total``: the files and tokens of some rows in a line. null for
     a result that lists none. */
  function carryCandidates(result) {
    const gone = new Set((droppedView(result) || {rows: []}).rows.map(row => row.id));
    const found = records(result.carry_candidates).map(entry => {
      const paths = strings(entry.paths), files = amount(entry.files), counted = amount(entry.tokens), rule = entry.by_rule === true;
      const left = strings(entry.capabilities).filter(id => gone.has(id)), cut = amount(entry.paths_left_out);
      return {rule, table: entry.kind === "data_table", files, tokens: counted, text: [some(paths, 3) + (cut ? " " + T("+{n} more paths", {n: cut}) : ""),
        files != null ? plural(files, "file") : "", counted != null ? tokenCount(counted) : "",
        codeWords(CARRY_KINDS, entry.kind), typeof entry.hint === "string" ? entry.hint.slice(0, 200) : "",
        left.length ? T("not in this edition: {names}", {names: some(left, 5)}) : ""].filter(Boolean).join(" · ")
        + " — " + T("to keep it, write {text}", {text: rule ? "carry=auto" : "carry=" + paths.join(",")}), paths};
    }).filter(row => row.paths.length);
    if (!found.length) return null;
    const sum = (rows, key) => rows.every(row => row[key] != null) ? rows.reduce((total, row) => total + row[key], 0) : null;
    const total = rows => {
      const files = sum(rows, "files"), counted = sum(rows, "tokens");
      return [files != null ? plural(files, "file") : "", counted != null ? tokenCount(counted) : ""].filter(Boolean).join(" · ") || String(rows.length);
    };
    return {rule: found.filter(row => row.rule), other: found.filter(row => !row.rule && !row.table), tables: found.filter(row => !row.rule && row.table), total};
  }
  /* What a delivery lacks against the original (result.lacks: a static comparison of the original's selected
     files with the delivered commit, delivery_lacks.shown), list by list, each row in a line: the names the
     contract names that the delivery does not have (first, and the one list that is more than a reminder);
     files with no file at the same path; module paths that can no longer be imported, with where their names
     are now; public names that are defined nowhere and that nothing kept uses; and functions that decide less
     by hardware or platform, which are to be looked at and are no finding; and the original's other files (a
     README, a licence, examples, data, configuration: no source the job rewrites and no test) that the delivery
     has no file for, with how many such files are there and differ (other_files_changed: a count, it names
     none). ``value``: the counts in a sentence
     (the record's own counts: a result lists the first rows of each), or that the comparison gave no answer
     and why, which must not read as "nothing is gone". A row may also be a text, and a list a count alone.
     null for a result without the record. */
  const LACK_REASONS = {time_limit: "the comparison passed its time limit", too_large: "the Python files to read are too large",
    unreadable: "Git could not read the original's or the delivered commit", no_plan: "the plan names no commit of the original or no selected file",
    failed: "the comparison itself failed"};
  const LACK_KINDS = {function: "function", class: "class", constant: "constant", method: "method"};
  const LACK_USERS = {nothing: "nothing else of the original uses it", outside_selection: "only code this run did not select, or tests it did not run, use it",
    carried_files: "a kept file still uses it, and may fail for it"};
  const LACK_STATES = {defined_nowhere: "defined nowhere in the delivery", module_path_gone: "the name is there, and the module path the contract writes is gone"};
  const LACK_MARKERS = {device_string: "device strings", torch_device_api: "the framework's device calls", platform_test: "platform tests",
    vendor_sdk_import: "guarded imports of a vendor's SDK"};
  function lacksView(result) {
    const lacks = result.lacks && typeof result.lacks === "object" && !Array.isArray(result.lacks) ? result.lacks : null;
    if (!lacks) return null;
    if (lacks.status === "not_computed") return {value: T("Not computed: {reason}", {reason: codeWords(LACK_REASONS, lacks.reason) || T(LACK_REASONS.failed)}),
      note: T("nothing is said here of what the delivery lacks"), contract: 0, lists: []};
    const text = value => typeof value === "string" && value ? value.slice(0, 200) : "", names = list => some(strings(list).map(name => name.slice(0, 80)), 8);
    // A row whose shape the page does not know is its texts, joined: nothing of a record is dropped for its shape.
    const plain = entry => typeof entry === "string" ? entry.slice(0, 300)
      : entry && typeof entry === "object" ? Object.values(entry).filter(value => typeof value === "string" && value).join(" · ").slice(0, 300) : "";
    const number = value => typeof value === "number" && Number.isFinite(value) ? String(value) : null;
    const rows = {
      contract_names_gone: entry => text(entry.name) ? [text(entry.path), entry.name, text(strings(entry.contract)[0]), codeWords(LACK_STATES, entry.state)].filter(Boolean).join(" · ") : "",
      module_paths_gone: entry => text(entry.module) ? [entry.module + (text(entry.path) ? " (" + entry.path + ")" : ""),
        ...Object.entries(dict(entry.moved_to)).slice(0, 5).map(([file, moved]) => T("its names are now in {file}: {names}", {file: file.slice(0, 200), names: names(moved)})),
        strings(entry.defined_nowhere).length ? T("defined nowhere: {names}", {names: names(entry.defined_nowhere)}) : "",
        amount(entry.names_omitted) ? T("+{n} more", {n: entry.names_omitted}) : "",
        amount(entry.contract_names) ? T("the contract names {n} names under this path", {n: entry.contract_names}) : ""].filter(Boolean).join(" · ") : "",
      public_names_gone: entry => text(entry.name) ? [text(entry.path), entry.name, codeWords(LACK_KINDS, entry.kind), codeWords(LACK_USERS, entry.used_by)].filter(Boolean).join(" · ") : "",
      hardware_decisions_changed: entry => text(entry.function) ? [text(entry.path), entry.function === "<module>" ? T("statements outside functions") : entry.function,
        number(dict(entry.decisions).original) ? T("decisions {before} → {after}", {before: number(entry.decisions.original), after: number(entry.decisions.delivered) ?? T("no function of that name")}) : "",
        number(dict(entry.file_decisions).original) ? T("the whole file {before} → {after}", {before: number(entry.file_decisions.original), after: number(entry.file_decisions.delivered) ?? "?"}) : "",
        strings(entry.markers).map(marker => codeWords(LACK_MARKERS, marker)).filter(Boolean).join(", ")].filter(Boolean).join(" · ") : ""};
    const counts = dict(lacks.counts), omitted = dict(lacks.omitted);
    const lists = [["contract_names_gone", T("Names the contract names that the delivery does not have"), ""],
      ["files_gone", T("Files with no file at the same path"), amount(lacks.files_gone_tokens) != null ? T("about {tokens} tokens", {tokens: tokens(lacks.files_gone_tokens)}) : ""],
      ["module_paths_gone", T("Module paths that are gone"), T("an import by the old path fails")],
      ["public_names_gone", T("Public names defined nowhere"), T("only those no kept code uses")],
      ["hardware_decisions_changed", T("Functions whose decisions by hardware or platform changed"), T("worth a look, and no finding: a branch that moved to another function or merged with another test counts as fewer")],
      ["other_files_gone", T("Other files of the original that are not in the delivery (documents, licences, examples, data, configuration)"), ""]]
      .map(([field, label, means]) => {
        const held = Array.isArray(lacks[field]) ? lacks[field] : [];
        const lines = held.map(entry => typeof entry === "string" ? plain(entry) : (entry && typeof entry === "object" && rows[field] ? rows[field](entry) : "") || plain(entry)).filter(Boolean).slice(0, 200);
        const count = amount(counts[field]) ?? (Array.isArray(lacks[field]) ? held.length : amount(lacks[field]));
        const rest = amount(omitted[field]) ?? (count != null && count > held.length && Array.isArray(lacks[field]) ? count - held.length : 0);
        return {field, label, means, count, lines: rest && lines.length ? [...lines, T("+{n} more", {n: rest})] : lines};
      }).filter(list => list.count != null && (list.field !== "contract_names_gone" || list.count > 0));
    if (!lists.length) return null;
    const of = field => (lists.find(list => list.field === field) || {count: 0}).count;
    const contract = of("contract_names_gone"), gone = ["files_gone", "module_paths_gone", "public_names_gone", "hardware_decisions_changed"].map(of);
    // What is gone and in no row, in counts (the record's not_listed): said after the note, so that the lists
    // are not read as all that changed.
    const unlisted = dict(lacks.not_listed), count = key => amount(unlisted[key]) || 0;
    const aside = ["used_by_kept_source", "named_by_kept_check", "in_private_modules", "defined_in_another_module"].some(count)
      ? T("Not listed: {source} helper names only the original's own code used, {check} names a kept check's file spells, {hidden} names of private modules, {moved} names now defined in another module",
        {source: count("used_by_kept_source"), check: count("named_by_kept_check"), hidden: count("in_private_modules"), moved: count("defined_in_another_module")}) : "";
    // The original's other files: how many the delivery has no file for, and how many it has that differ.
    const other = of("other_files_gone"), changed = amount(lacks.other_files_changed) || 0;
    const others = [other ? T("other files not in the delivery: {n}", {n: other}) : "",
      changed ? T("other files in the delivery that differ from the original's: {n}", {n: changed}) : ""].filter(Boolean);
    return {contract, lists, note: [typeof lacks.note === "string" ? lacks.note.slice(0, 600) : "",
        others.length && typeof lacks.other_note === "string" ? lacks.other_note.slice(0, 600) : "", aside].filter(Boolean).join(" · "),
      value: [contract || gone.some(Boolean) || others.length ? T("files: {files} · module paths: {modules} · public names: {names} · functions that decide less by hardware or platform: {functions} (worth a look)",
        {files: gone[0], modules: gone[1], names: gone[2], functions: gone[3]})
        : T("the static comparison found no file, module path or public name that is gone"), ...others].join(" · ")};
  }

  /* What a run that delivered has to show for it, as a few facts for the top of the page: its size
     against the original, the behavior checks of the candidate it delivered, and where the copy is.
     Nothing for a run that delivered nothing: its error says what happened. */
  function resultFacts(view) {
    const job = view.job, progress = view.progress || {};
    if (!job || !["succeeded", "completed_with_gaps", "delivered_with_failures"].includes(job.status)) return [];
    // The size: one figure, or the rewritten part's beside the whole repository's with what the tokens are made of (sizeFacts).
    const facts = sizeFacts(job.result || {});
    // The delivered candidate's comparison: a controller job names the candidate it selected, a fixed job delivers its last.
    const selected = ((progress.ledger || {}).candidates || []).find(candidate => candidate.selected), attempts = progress.attempts || [];
    const compared = (selected && selected.verification) || (attempts.length ? attempts[attempts.length - 1].verification : null);
    if (compared && compared.checks) facts.push({label: T("Behavior checks"), value: suiteText(compared)});
    // The selected capabilities that had no valid test when the contract was sealed (the result's
    // untested_capabilities) and that an author rewrote all the same, which nothing of the job verifies. Before,
    // only an event at the seal and a gap among others said it; the top of a finished run said nothing of them.
    const untested = (job.result || {}).untested_capabilities || {};
