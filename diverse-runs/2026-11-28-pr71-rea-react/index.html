    const listed = ids => { const names = (Array.isArray(ids) ? ids : []).filter(id => typeof id === "string");
      return [...names.slice(0, 20), names.length > 20 ? T("+{n} more", {n: names.length - 20}) : ""].filter(Boolean).join(", "); };
    if (listed(untested.rewritten)) facts.push({label: T("Rewritten without a valid test"), value: listed(untested.rewritten),
      note: T("an author rewrote them, and no check of the job fails when that code is wrong")});
    // What the delivery holds as the original's, in one fact: how much, group by group why, and how many of the
    // kept capabilities a check verifies (keptView). Before, the top named only the kept capabilities without a
    // valid test, as "carried for want of a valid test": that is wrong of a capability its owner chose to keep
    // or the rule found, and it said nothing of kept code that has its tests.
    const kept = keptView(job.result || {});
    if (kept) facts.push({label: T("Kept as the original's"), value: [keptTotals(kept), keptIsNoGap(job) ? T("no gap of the delivery") : ""].filter(Boolean).join(" · "),
      note: [kept.groups.map(keptGroupLine).join(T("; ")), keptUndecided(kept), keptChecked(kept)].filter(Boolean).join(T("; "))});
    // The capabilities that count as tested by the weaker knockout alone (the result's validated_by_withheld_product):
    // their code is built by the owner's preparation, and their checks fail when that product is withheld.
    const weak = (job.result || {}).validated_by_withheld_product;
    if (listed(weak)) facts.push({label: T("Tested only by withholding the built product"), value: listed(weak),
      note: T("their checks need what the preparation built; nothing shows that they notice a wrong result of it")});
    // What the job's stop rule says to keep next time (the result's carry_suggestions), as the text to type.
    const again = [...new Set(records((job.result || {}).carry_suggestions).flatMap(entry => strings(entry.paths)))];
    if (again.length) facts.push({label: T("Keep next time"), value: "carry=" + again.join(","),
      note: T("the job could not make this code work rewritten")});
    // Where the delivered code lies (the page is told the folder's name, never a path of the machine), and the
    // report of this delivery, which the page itself serves once the job generated it.
    const copy = progress.export || {};
    if (copy.name && copy.status !== "failed")
      facts.push({label: T("Local copy"), value: copy.name, note: T("a folder next to the project's own")});
    if ((progress.report || {}).route === "/report/") facts.push({label: T("Report"), value: T("Open the report"), href: "/report/"});
    return facts;
  }

  /* What a delivery is measured by, each criterion with whether it holds and, where it does not, why:
     "unconfigured" (nothing was configured to check it, so nothing ran) or "" (not shown to hold). The outcome
     is the job's own and stays what it is; the page only stops showing a check nobody configured as loudly as
     one that did not hold. ``gaps``: the gaps of a delivery's acceptance report (job_tools.acceptance.GAPS) the
     criterion stands for. Where it does not hold, the end note and the Outcome item of stage 06 do not say those
     gaps beside it (otherGaps). */
  function outcomeCriteria(view, m) {
    const result = m.result, installation = result.installation || {}, base = (((view.progress || {}).freeze) || {}).baseline || {};
    const criteria = [
      {label: T("Behavior checks passed"), ok: result.verification_status === "checks_passed", why: "",
       gaps: ["current_full_behavior_comparison_missing_or_failed", "original_retained_checks_not_passed"]},
      {label: T("Original baseline ready"), ok: base.status === "ready", why: "", gaps: ["original_coverage_incomplete"]},
      {label: T("Obligation ledger complete"), ok: result.obligations_complete === true, why: "", gaps: ["behavior_obligations_incomplete"]},
      // (``subject``: what the criterion is about, for the sentence that says nothing was configured to check it.)
      {label: T("Installation passed"), subject: T("Installation check"), ok: installation.status === "passed",
       why: installation.status === "not_configured" ? "unconfigured" : "", gaps: ["installation_not_passed"]},
    ];
    // The original tests that a conversion left out of acceptance: a criterion once the job has their record.
    const left = (result.original_checks || {}).summary;
    if (left) criteria.push({label: T("Left-out original tests verified"), ok: left.unverified === 0, why: "", gaps: ["original_checks_not_verified"]});
    // What the delivered candidate's comparison with the original showed: only a job with performance acceptance on has it.
    // A project that declares no performance had none to preserve: that is no criterion, so neither held nor a gap.
    const speed = result.performance;
    if (speed && speed.status !== "not_declared")
      criteria.push({label: T("Performance preserved"), ok: speed.status === "passed", why: "", gaps: ["performance_not_preserved"]});
    // The questions the job's controller recorded and nobody settled (the result's unknowns, job_tools.manage.unsettled):
    // a criterion once a delivery lists any, which holds while none of them is blocked.
    const unknowns = (Array.isArray(result.unknowns) ? result.unknowns : []).filter(question => question && typeof question === "object");
    const blocked = unknowns.filter(question => question.status === "blocked").length;
    if (unknowns.length) criteria.push({label: T("No question left blocked"), ok: blocked === 0, why: "", gaps: ["unresolved_unknowns"]});
    // The retained checks the delivered candidate's comparison set aside for the scope: a criterion once the
    // job has a scope baseline, or its result names such a check. Each is a gap, so the delivery has gaps.
    // (A delivery names them under the gap of the original's coverage: job_tools.acceptance, original_coverage_incomplete.)
    const aside = scopeAside(result);
    if (aside.length || scopeBaseline(result.scope_baseline))
      criteria.push({label: T("No retained check set aside for the scope"), ok: aside.length === 0, why: "", gaps: ["original_coverage_incomplete"]});
    return criteria;
  }

  /* The gaps a delivery recorded (result.acceptance.gaps): a controller job's result has the list, a fixed job's
     has none. An entry is a gap's name (job_tools.acceptance.GAPS), as a delivery passes its report on, or an
     object that names it (``gap``), the shape a round's context and a held delivery give a gap. A name is a code
     (CODE), as a claim's reason is (claimLines). ``unread``: the record holds something the page cannot read, so
     the page does not know everything the delivery recorded: an entry of the list that is neither, or gaps that
     are there and are no list (a string, an object keyed by the gap, a number). Gaps that are absent or null, and
     an ``acceptance`` that is no object, are no list. A result is the job's own record, passed on as it is. */
  function recordedGaps(result) {
    const listed = result && result.acceptance ? result.acceptance.gaps : null;
    if (!Array.isArray(listed)) return {names: [], unread: listed != null};
    const code = value => typeof value === "string" && CODE.test(value) ? value : "";
    const read = listed.map(entry => code(entry && typeof entry === "object" ? entry.gap : entry));
    return {names: [...new Set(read.filter(Boolean))], unread: read.some(name => !name)};
  }
  const gapName = name => Object.hasOwn(GAPS, name) ? T(GAPS[name]) : name.replaceAll("_", " ");
  /* What a delivery recorded as a gap beyond the page's criteria (``criteria``: outcomeCriteria), one line each:
     the recorded gaps that no criterion which does not hold stands for, by the page's words for them (twenty at
     most, then how many more, as the page cuts its other lists), and a last line where the record holds
     something the page cannot read, however much of it. The end note says these lines and the Outcome item of
     stage 06 lists them, the same ones. A result without recorded gaps has none; gaps that are there and are no
     list have the last line alone (recordedGaps). */
  function otherGaps(result, criteria) {
    const recorded = recordedGaps(result), stood = new Set(criteria.filter(criterion => !criterion.ok).flatMap(criterion => criterion.gaps));
    const names = recorded.names.filter(name => !stood.has(name));
    return [...names.slice(0, 20).map(gapName), ...(names.length > 20 ? [T("+{n} more", {n: names.length - 20})] : []),
      ...(recorded.unread ? [T("Something recorded in a form the page cannot read")] : [])];
  }

  /* Of a job that completed with gaps: whether its gaps are only checks nobody configured (``quiet``), and the
     sentence that says so. null for every other job, and for one whose criteria all hold and whose result
     records no gap.
     The criteria are the page's own list, and a delivery may have recorded a gap that none of them stands for
     (the owner's preparation recipes failed beside the delivered candidate, an unstable observation, …). Before,
     such a delivery read "Nothing failed", drawn lighter, where its one criterion that did not hold was an
     unconfigured check, and had no note where every criterion held. Where the result names its gaps, the note
     is quiet only if an unconfigured criterion accounts for every one of them; any other gap is said, in the
     page's words for it, after the criteria that do not hold (otherGaps). A gap that a criterion which does not
     hold stands for is not said beside it (nor is the gap of an unconfigured check, which is not what fell
     short). A record of gaps that holds something the page cannot read (recordedGaps: an entry of the list, or
     gaps that are no list) is never quiet: the rule does not err toward "nothing failed". A result without
     recorded gaps is read by the criteria alone. */
  function endNote(view) {
    const job = view.job;
    if (!job || job.status !== "completed_with_gaps" || !view.model) return null;
    const criteria = outcomeCriteria(view, model(view)), unmet = criteria.filter(criterion => !criterion.ok);
    const other = otherGaps(job.result, criteria);
    if (!unmet.length && !other.length) return null;
    const idle = unmet.filter(criterion => criterion.why === "unconfigured"), short = unmet.filter(criterion => criterion.why !== "unconfigured");
    const names = (rows, subject) => rows.map(criterion => (subject && criterion.subject) || criterion.label).join(T(", "));
    if (!short.length && !other.length)
      return {quiet: true, text: T("Nothing failed. Not checked, because nothing is configured for it: {names}.", {names: names(idle, true)})};
    // A gap's words say what is missing ("… not passed"), a criterion's what should hold: each in a sentence of its own.
    return {quiet: false, text: [short.length ? T("Not shown to hold: {names}.", {names: names(short)}) : "",
      other.length ? T("Recorded by the delivery as a gap: {names}.", {names: other.join(T(", "))}) : ""].filter(Boolean).join(" ")};
  }

  function stageFlow(view, m, index) {
    const out = stageItems(view, m, index);
    if (m.states[index] === "paused") out.now = pauseText(m.job);  // what it waits for, not what it last did
    // A pair whose two jobs run on this machine says so in the stage they work beside each other in, from the
    // job's first events on (pairItem); stage 06 says it again with what the delivery found.
    const beside = m.stages[index].id === "freeze" ? pairItem(view) : null;
    if (beside) out.items.push(beside);
    // That the job's worker runs elsewhere than the machine that answers (the status answer's executor.worker:
    // execution._status), in the stage the job is in, with how old its heartbeat was when the status was read.
    // The page is given the age alone (run_dashboard._job_view): which machine it is stays with the owner's own
    // status, and nothing here shows a name. Before, a job whose worker ran in another container or on a compute
    // node read here like any other, and nothing said that what the page shows is a heartbeat's word.
    const worker = m.job && m.job.executor && m.job.executor.worker;
    if (worker && typeof worker === "object" && m.states[index] === "active")
      out.items.push(item("note", T("Worker on another machine"), "active",
        {value: Number.isFinite(worker.heartbeat_age_seconds)
          ? T("heartbeat {n} s ago", {n: Math.max(0, Math.round(worker.heartbeat_age_seconds))}) : T("heartbeat age not known"),
         rule: T("The machine that serves this page does not run the job's worker. It takes the worker to be alive by the heartbeat the worker writes into the job's state, and shows what that state held when it was read")}));
    const ledger = (view.progress || {}).ledger;
    if (ledger && m.job) {
      ledgerFlow(out, ledger, m, index, (view.progress || {}).limits || {}, jobStrategy(view));
      resultItems(out, view, m, index);
    }
    return out;
  }

  /* What a controller job's freeze and comparison tools returned beyond their records (plan S7) and
     where the job stands against delivery as its newest round's context said it, each in the stage it is
     about: in 03 the freeze's steps and leaf test policy, the baseline's usability and the caps the
     seal found; in 06 the delivery the job could make now and the caps on it. A fixed job has none of
     these, and its page is what it was. */
  function resultItems(out, view, m, index) {
    const stage = m.stages[index].id, progress = view.progress || {}, freeze = progress.freeze || {};
    const ledger = progress.ledger || {};
    if (stage === "freeze") {
      const workspace = freeze.workspace;
      if (workspace) out.chips = [...(out.chips || []),
        [T("Readiness audit"), [enumWord(workspace.readiness) || "—", ...(workspace.readiness_issues || [])].join(" · ")],
        [T("Freeze steps"), (workspace.freeze_steps || []).map(toolTitle).join(" → ") || "—"],
        [T("Leaf test policy"), policyText(workspace.leaf_test_policy)]];
      const usable = freeze.usability;
      if (usable) out.items.push(item("gate", T("A usable oracle"), usable.usable === true ? "done" : usable.usable === false ? "failed" : "skipped",
        {value: [usable.usable === true ? T("usable") : usable.usable === false ? T("not usable") : T("not judged under a diagnostic contract"),
          (usable.leaves_without_valid_test || []).length ? T("without a valid test: {ids}", {ids: usable.leaves_without_valid_test.join(", ")}) : "",
          usable.knockouts_not_evaluated ? T("{n} knockouts not evaluated", {n: usable.knockouts_not_evaluated}) : "",
          usable.docstring_example_cases ? T("{n} docstring example cases pinned", {n: usable.docstring_example_cases}) : "",
          // Files of the original a capture could not measure into its fingerprint: said, with what follows from it.
          usable.unmeasured ? T("{n} files of the original not measured into the fingerprint", {n: usable.unmeasured}) : "",
          usable.recapture_after_preparation ? T("captured again after a preparation") : ""].filter(Boolean).join(" · "),
         rule: T("The newest capture's verdict: a baseline the seal keeps is safe and has no problem that leaves it no oracle"),
         ...((usable.problems || []).length ? {criteria: usable.problems.map(problem => ({label: problem, status: "failed"}))
           .concat(usable.problems_total > usable.problems.length ? [{label: T("+{n} more", {n: usable.problems_total - usable.problems.length}), status: "failed"}] : [])} : {})}));
      // The job's scope baseline, where its selection removes source: from the job's record, so also while the
      // run that found too much holds the job for its owner.
      const scoped = scopeBaselineItem(freeze.scope_baseline);
      if (scoped) out.items.push(scoped);
      if (freeze.caps) out.items.push(capsItem(T("Caps certain at the seal"), freeze.caps));
    }
    if (stage === "deliver") {
      // The newest round's context, made when that round began: its calls (and a delegation) may have moved the job since.
      const now = ledger.acceptance;
      if (now && !m.terminal) out.items.push(item("gate", T("A delivery as round {n} began", {n: now.round}),
        now.status === "succeeded" ? "done" : now.status === "delivered_with_failures" ? "failed" : "gap",
        {value: [now.status === "blocked" ? T("nothing deliverable") : JOB_STATUS[now.status] ? T(JOB_STATUS[now.status]) : enumWord(now.status),
          now.best_reachable ? T("best reachable: yes") : T("best reachable: no"), now.reason || ""].filter(Boolean).join(" · "),
         rule: T("What a delivery would have given when the newest round began, as its context said before that round's calls ran; each gap says whether a tool of the job could still close it"),
         criteria: (now.gaps || []).map(gap => ({label: gapText(gap),
           status: gap.failed ? "failed" : gap.closable === false || gap.by_delivery ? "skipped" : "gap"}))}));
      const caps = ledger.caps || freeze.caps;
      if (caps && caps.length) out.items.push(capsItem(T("Caps on the delivery"), caps));
    }
  }

  // The caps of a delivery's status: each a gap no tool can close, with why and what it is about.
  function capsItem(label, caps) {
    return item("gate", label, caps.length ? "gap" : "done", {value: caps.length ? T("at best completed with gaps") : T("none"),
      rule: T("A cap keeps the delivery at completed with gaps at best: no tool of the job can close it"),
      ...(caps.length ? {criteria: caps.map(cap => ({label: capText(cap), status: "skipped"}))} : {})});
  }
  function capText(cap) {
    const about = [...(cap.checks || []), ...(cap.steps || []), ...(cap.capabilities || []), ...(cap.issues || [])];
    // (a reason that only repeats its gap is left out: "left-out original tests not verified — original tests unverified")
    return [GAPS[cap.gap] ? T(GAPS[cap.gap]) : String(cap.gap || "?").replaceAll("_", " "),
      cap.reason === "original_tests_unverified" ? "" : String(enumWord(cap.reason)).replaceAll("_", " "),
      about.length ? about.slice(0, 8).join(", ") + (about.length > 8 ? ", …" : "") : "",
      cap.tests != null ? T("{n} tests", {n: cap.tests}) : "", cap.cases != null ? T("{n} cases", {n: cap.cases}) : "",
      ...(cap.problems || []).slice(0, 2)].filter(Boolean).join(" — ");
  }
  /* A long freeze step that reports how far it has come (job.step_progress, while it runs): a
     capture's checks, then its knockouts with the leaves done (on a compute node only how many
     leaves), then its scope baseline where the job makes one; a design, with its stage and round
     where it names them and the knockouts of its trial while they run. "" without one. */
  // A design's stage in words; one the page does not know is shown as it is named.
  const DESIGN_STAGES = {designers: () => T("designer sessions"), trial: () => T("trial"), review: () => T("review"),
    final_trial: () => T("final trial"), exclusion_review: () => T("exclusion review")};
  const designStage = stage => Object.hasOwn(DESIGN_STAGES, stage) ? DESIGN_STAGES[stage]() : String(stage).replaceAll("_", " ");
  function stepText(progress) {
    if (!progress || !progress.tool) return "";
    const knocked = progress.knockouts, onNode = knocked && knocked.place === "compute_node";
    const knockouts = !knocked || knocked.leaves == null ? "" : onNode ? T("knockouts of {leaves} leaves on a compute node", {leaves: knocked.leaves})
      : T("knockouts, {done} of {leaves} leaves", {done: knocked.leaves_done ?? 0, leaves: knocked.leaves});
    if (progress.tool === "capture_baseline") return progress.stage === "knockouts" && knockouts
      ? T("Capturing the baseline: {what}.", {what: knockouts})
      // After its checks and its knockouts (job_tools.freeze._scope_run_in): the tree is built and prepared, the
      // retained checks run in it, what failed there runs again there, and what failed both times runs once on
      // the unchanged original.
      : progress.stage === "scope_baseline" ? T("Capturing the baseline: the scope baseline (the retained checks, run on the original without what the selection removes).")
      : T("Capturing the baseline: checks.");
    if (progress.tool === "compare_behavior") {
      // A comparison counts its checks: those whose result stands, of how many, and how many may run beside each
      // other now (the ones its baseline marked as safe, in private copies; the others in the tree, one at a time).
      const checks = progress.checks;
      if (!checks || checks.total == null) return "";
      if (checks.place === "compute_node") return T("Comparing with the original: {total} checks on a compute node.", {total: checks.total});
      const counted = {done: Math.min(checks.done ?? 0, checks.total), total: checks.total, n: checks.at_once};
      return checks.at_once > 1 ? T("Comparing with the original: {done} of {total} checks done, up to {n} at once.", counted)
        : T("Comparing with the original: {done} of {total} checks done, one at a time.", counted);
    }
    if (progress.tool === "design_leaf_tests") {
      // A design that names no stage of its own says "design": the step itself, with the knockouts of a trial that runs.
      const named = progress.stage && progress.stage !== "design" ? designStage(progress.stage) : "";
      const stage = named ? named + (knockouts ? " (" + knockouts + ")" : "") : knockouts;
      if (!stage) return progress.round != null ? T("Designing tests, round {n}.", {n: progress.round}) : T("Designing tests.");
      return progress.round != null ? T("Designing tests: {stage}, round {n}.", {stage, n: progress.round}) : T("Designing tests: {stage}.", {stage});
    }
    return "";
  }
  function policyText(policy) {
    if (!policy) return T("none: no test design");
    return [policy.design ? T("design on") : T("design off"),
      policy.strict ? T("strict") : "", policy.knockout_scope ? T("knockouts: {scope}", {scope: String(policy.knockout_scope).replaceAll("_", " ")}) : "",
      policy.scenarios ? T("scenarios: {which}", {which: String(policy.scenarios).replaceAll("_", " ")}) : ""].filter(Boolean).join(" · ");
  }

  /* A controller job's run ledger. Its candidates replace the attempt rounds of stages 04 and 05; the
     state head joins stages 03 and 05, the controller's rounds stage 05, the deliveries its require
     held back stage 06; and where the job is, the operations that have not ended and what waits for
     the owner are listed. Fixed jobs have no ledger. ``strategy``: the job's (jobStrategy), for who took
     a step that no agent chose. */
  function ledgerFlow(out, ledger, m, index, limits = {}, strategy) {
    const stage = m.stages[index].id, head = ledger.head || {}, selected = head.selected;
    // A delivery that selected the current candidate itself says so (decision 28): no candidate was selected.
    const byDelivery = Boolean(selected && selected.id && selected.by === "deliver");
    const chosen = () => [T("Selected candidate"), [selected.id, byDelivery ? T("selected by the delivery") : "", reasonName(selected.reason, holdsPerformance(limits))]
      .filter(Boolean).join(" · ")];
    if (out.rounds && ledger.candidates.length) {
      out.candidates = ledger.candidates;
      out.selectedBy = byDelivery ? "deliver" : null;
      out.rounds = null;
      // The reason is the controller's own words, or the policy's reason code when the job took the advised step.
      if (selected && selected.id) out.chips = [...(out.chips || []), chosen()];
    }
    if (stage === "verify") verifyGates(out, ledger, m.states[index], limits);
    if (stage === "verify" && ledger.rounds.length) out.controller = ledger.rounds;
    // Parallel mode: the first implementation by layer, and every parallel group with a row for each request; while
    // one runs, the stage says what its authors are doing (its newest event may be of an earlier step).
    if (stage === "rewrite" && (ledger.layers || []).length) out.items.push(layersItem(ledger.layers));
    if (stage === "rewrite" && (ledger.groups || []).length) out.groups = ledger.groups;
    const live = stage === "rewrite" && m.states[index] !== "paused" ? (ledger.groups || []).filter(group => group.status === "running").pop() : null;
    if (live) {
      const states = (live.requests || []).map(row => row.state), counted = state => states.filter(value => value === state).length;
      out.now = [T("Parallel group {id} ({kind})", {id: live.id || "?", kind: groupKind(live.kind)}), T("{n} writing", {n: counted("running")}),
        counted("waiting") ? T("{n} not started yet", {n: counted("waiting")}) : "", counted("ended") ? T("{n} ended", {n: counted("ended")}) : ""]
        .filter(Boolean).join(" · ");
    }
    if (stage === "deliver") {
      if (byDelivery) out.chips = [...(out.chips || []), [T("Selected candidate"), selected.id + " · "
        + T("selected by the delivery itself, as no candidate was selected")]];
      heldDeliveries(out, ledger.held || [], strategy);
    }
    if (stage === "freeze" || stage === "verify") {
      out.chips = [...(out.chips || []), [T("Contract"), head.requirements_contract && head.requirements_contract !== head.contract
        ? T("{contract} · requirements {requirements}", {contract: head.contract, requirements: head.requirements_contract}) : head.contract || "—"],
        [T("Owner revision"), head.owner_revision || "—"],
        [T("Environment revisions"), T("candidate {candidate} · original {original}",
          {candidate: head.environment_revision ?? 0, original: head.original_environment_revision ?? 0})]];
    }
    if (index !== m.current) return;
    for (const op of ledger.operations) out.items.push(item("step", T("Operation {id}: {tool}", {id: op.id || "?", tool: toolTitle(op.tool)}),
      op.status === "running" ? "active" : "gap", {value: [enumWord(op.status), op.background ? T("background") : "", callerName(op.caller, strategy)].filter(Boolean).join(" · "),
        rule: T("Started and not ended: running while its worker lives, interrupted once that stopped; nothing is known of what an interrupted operation did")}));
    for (const question of ledger.questions) out.items.push(item("step", T("Question {id}", {id: question.id || "?"}),
      question.waiting ? "paused" : "pending", {value: question.question || "",
        rule: T("Not answered yet: answer it with nanolize job-answer; an answer is guidance, never a pass")}));
    for (const revision of ledger.revisions) out.items.push(item("step", T("Revision request {id}", {id: revision.id || "?"}),
      revision.waiting ? "paused" : "pending", {value: revision.reason || "",
        rule: T("Proposed, not granted: only the owner authorizes it, with nanolize job-authorize")}));
    for (const flag of ledger.flagged_checks || []) out.items.push(item("step", T("Flagged check {id}", {id: flag.check || "?"}),
      "gap", {value: [flag.reason || "", (flag.evidence || []).length ? T("evidence {ids}", {ids: flag.evidence.join(", ")}) : ""].filter(Boolean).join(" · "),
        rule: T("The controller suspects this check of over-constraining the rewrite: it changes no verdict, and only the owner can act on it")}));
  }

  /* The deliveries deliver(require) held back (run_dashboard._held), newest first: what each required,
     the status it would have had, and every gap of its acceptance report with whether the evidence
     shows a failure and whether a tool of the job can still close it. Only the newest few are shown whole.
     ``strategy``: the job's (jobStrategy), for a delivery that no round asked for. */
  function heldDeliveries(out, held, strategy) {
    const shown = held.slice(-3).reverse();
    for (const delivery of shown) {
      const status = delivery.status && JOB_STATUS[delivery.status] ? T(JOB_STATUS[delivery.status]) : enumWord(delivery.status) || "?";
      out.items.push(item("gate", T("Delivery held back: require {require}", {require: enumWord(delivery.require) || "?"}), "gap", {
        value: [T("would be {status}", {status}), delivery.round != null ? T("round {n}", {n: delivery.round}) : callerName(delivery.caller, strategy),
          delivery.id || ""].filter(Boolean).join(" · "),
        rule: [REQUIRE[delivery.require] ? T(REQUIRE[delivery.require]) : "",
          T("Not delivered and nothing changed: the delivery acceptance report fell short of what the call required. Each gap says whether a tool of the job can still close it.")]
          .filter(Boolean).join(" — "),
        criteria: (delivery.gaps || []).map(gap => ({label: gapText(gap),
          status: gap.failed ? "failed" : gap.closable === false ? "skipped" : "gap"}))}));
    }
    if (held.length > shown.length) out.items.push(item("note", T("{n} earlier deliveries held back", {n: held.length - shown.length}), "gap"));
  }

  // A question nobody settled, as a delivery's result lists it (job_tools.manage.unsettled): its id and status, the
  // question, what blocks it, and the capabilities and artifacts it names.
  function unknownText(question) {
    const list = value => (Array.isArray(value) ? value : []).filter(entry => typeof entry === "string");
    return [[question.id || "?", enumWord(question.status)].filter(Boolean).join(" · "), question.question || "",
      question.blocker ? T("blocked by: {why}", {why: question.blocker}) : "",
      list(question.capabilities).length ? T("capabilities {ids}", {ids: list(question.capabilities).join(", ")}) : "",
      list(question.evidence).length ? T("evidence {ids}", {ids: list(question.evidence).join(", ")}) : ""].filter(Boolean).join(" — ");
  }

  // A gap of a delivery acceptance report: what it is, whether it is a failure or can still be closed, and what its detail adds.
  function gapText(gap) {
    const name = GAPS[gap.gap] ? T(GAPS[gap.gap]) : String(gap.gap || "?").replaceAll("_", " ");
    // by_delivery: nothing is selected, and a controller job's delivery selects the current candidate itself (run_dashboard).
    const how = gap.failed ? (gap.closable === false ? T("an observed failure no repair is left for") : T("an observed failure"))
      : gap.by_delivery ? T("the delivery selects the current candidate itself")
      : gap.closable === true ? T("a tool can still close it") : gap.closable === false ? T("no tool of the job can close it") : "";
    return [name, how, (gap.excluded || []).length ? T("excluded by the owner: {ids}", {ids: gap.excluded.join(", ")}) : "",
      (gap.no_gpu || []).length ? T("their batch got no GPU: {ids}", {ids: gap.no_gpu.join(", ")}) : "",
      gap.stale ? T("stale baseline: {why}", {why: gap.stale}) : ""].filter(Boolean).join(" — ");
  }

  /* A controller job adopts no decision of the fixed pipeline (no repair.json), and runs the owner's
     delivery checks and the installation check only when its controller calls them. Its verification
     gates therefore read what the ledger holds for the current candidate; left as they were, they
     would say "Waiting" for good, also on a delivered job. The fixed pipeline's "Next action" has no
     counterpart: the Controller item below it says what was chosen. */
  function verifyGates(out, ledger, state, limits) {

      }

    GAPS, REQUIRE, EVIDENCE_KINDS, CLAIM_REASONS, COMMAND_REASONS, COMMAND_OUTCOMES, commandLines, PAGE_TEXT, setLocale, T, model, stageFlow, jobActions, pauseText, pauseNeeds, resultFacts, outcomeCriteria, endNote, endedText,
    KEEP_GROUPS, KEEP_GROUP_LABELS, KEEP_REASONS, CARRY_WHY, CARRY_KINDS, keptView, droppedView, droppedNote, sizeParts, sizeFacts, pairView, pairItem,
    deliveryNotes, carryCandidates, lacksView, joinsItem, PAIR_JOBS, PAIR_GATES, JOIN_STATUS, LACK_REASONS, LACK_KINDS, LACK_USERS, LACK_STATES, LACK_MARKERS,
    overall, runSpan, stepLimit, span, useCatalog, roundRows,

});

<script>

   its name read as words. Pure functions are exported for tests; the browser part

   textContent only (manifest and job text is data). The graph arrives projected and bounded by

    "original": "原始测试", "adapted": "改写测试", "contract": "契约测试", "check": "检查",
    "Retained": "保留", "Needs adaptation": "需要改写", "compares {what}": "比对{what}", "exit": "退出码", "output": "输出",

    "whole file": "整个文件", "Showing the first {shown} of {total} tests.": "只显示前 {shown} 个，共 {total} 个测试。",
    "Compares the program's output with the frozen original; no pytest node ids.": "比对程序输出与冻结的原版；没有 pytest 用例 ID。",
    "No pytest node ids were declared for this check.": "这项检查没有声明 pytest 用例 ID。",
    "Source files ({n})": "源文件（{n}）",
    "Only part of this large plan is shown.": "规划较大，这里只显示其中一部分。",
    // the capabilities somebody works on right now (liveMarks)
    "Now": "此刻", "working on it": "正在处理", "queued": "排队中", "done in this step": "这一步里已完成", "not completed in this step": "这一步里未完成",
    " · {n} capability worked on now": " · 此刻有 {n} 个能力正在处理", " · {n} capabilities worked on now": " · 此刻有 {n} 个能力正在处理",
    "{label}: {state} · now: {work}": "{label}：{state} · 此刻：{work}",
  };
  for (const [key, value] of Object.entries(ZH)) if (!Object.hasOwn(dashboard.ZH, key)) dashboard.ZH[key] = value;
  const counted = (n, one, many) => T(n === 1 ? one : many, {n});

  const GLYPH = {passed: "✓", partial: "◐", failed: "✗", untested: "–", retired: "⊘", pending: "…", unknown: "?"};
  const LEGEND = {
    assign: {passed: "Tests assigned · the original passes them", partial: "Some assigned checks have no usable original result",
      failed: "An assigned check does not pass on the original", pending: "Baseline not captured yet",
      untested: "No usable assigned tests", retired: "Out of scope"},
    results: {passed: "All assigned checks passed", partial: "Some assigned checks were not tested",
      failed: "An assigned check failed", pending: "Waiting for this round", untested: "Not tested", retired: "Out of scope"},
  };
  const SHORT = {passed: "passed", partial: "partial", failed: "failed", untested: "not tested", retired: "out of scope",
    pending: "waiting"};
  const GROUPS = {retained: "Retained", needs_adaptation: "Needs adaptation", retired: "Out of scope"};
  // The original's own result per check: an unstable oracle verifies nothing, so it counts as untested.
  // A check never run on the original (for example one that needs adaptation) has no result, not a failure.
  const BASELINE = {passed: "passed", failed: "failed", unstable: "untested", not_run: "untested"};
  const hasResults = round => Boolean(round) && Object.keys(round.checks).length > 0;
  /* A round recorded as unverified (for example the environment changed during its checks) proves no
     pass, so its passes read as partial. A regressed round had no such issue; its passes stand. */
  const proven = (state, round) => state === "passed" && round && round.status && !["checks_passed", "regressed"].includes(round.status)
    ? "partial" : state;
  /* The round still running: the first after the latest finished one without results. A rejected
     round's output never reached verification, so it is not running; nor is one whose comparison was
     made and was too large to read (`unreadable`). */
  const runningRound = (rounds, latest) => rounds.find(item => !hasResults(item) && !item.rejected && !item.unreadable
    && (!latest || item.n > latest.n));
  /* What the graph shows under the stage whose panel is open, by the stage's id: Select scope (02) shows
     the scope before and after the selection, Freeze contract (03) assigns tests, Rewrite and Verify &
     repair (04-05) show results by round; any other stage has no graph. Not by the number the panel
     prints: a page that numbers its stages otherwise (an earlier version's recording) has the same graph
     under the same stages. */
  const STAGE_MODES = {scope: "scope", freeze: "assign", rewrite: "results", verify: "results"};
  function stageMode(stage) { return Object.hasOwn(STAGE_MODES, stage) ? STAGE_MODES[stage] : null; }
  /* What one test is called in a tooltip, by the result it stands under. */
  const TEST_STATE = {
    assign: {passed: "passed on the original", failed: "fails on the original", untested: "no usable result on the original",
      pending: "waiting for the baseline", unknown: "the check failed without naming its tests", retired: "out of scope"},
    results: {passed: "passed", failed: "failed", partial: "passed, in a round that is not verified", untested: "not run",
      pending: "waiting", unknown: "the check failed without naming its tests", retired: "out of scope"},
  };

  /* The capabilities somebody works on right now, as the run's flow names them (run-flow.js liveLeaves: a
     Map of capability id -> its marks, each {look, word}): a test designer writes tests for a leaf, an
     author writes the scope a capability is in. One look for a capability with several marks: one that
     runs before one that waits, before one that failed, before one that is done. */
  const LIVE_ORDER = ["running", "planned", "bad", "good", "skipped"];
  const LIVE_WORDS = {running: "working on it", planned: "queued", good: "done in this step", bad: "not completed in this step",
    skipped: "not completed in this step"};
  function liveMarks(live, id) {
    const marks = (live && live.get(id)) || [];
    if (!marks.length) return null;
    const look = LIVE_ORDER.find(value => marks.some(mark => mark.look === value)) || "skipped";
    return {look, marks, words: marks.map(mark => mark.word).filter(Boolean).join(" · ")};
  }
  let shared = new Map(), listener = null;  // what the page last said works now, and the panel that draws it
  /* The page says which capabilities are worked on now; the panel draws them again when that changed. */
  function live(found) {
    shared = found instanceof Map ? found : new Map();
    if (listener) listener();
  }

  /* A forest of capabilities with the checks assigned to each; a check naming no capability applies to every root. */
  function graphIndex(graph) {
    const byId = new Map((graph.nodes || []).map(node => [node.id, node])), roots = [];
    const children = new Map([...byId.keys()].map(id => [id, []]));
    for (const node of byId.values()) {
      const parent = node.parent !== node.id && byId.has(node.parent) ? node.parent : null;
      (parent === null ? roots : children.get(parent)).push(node);
    }
    const reached = new Set();
    const walk = start => {
      const stack = [start];
      while (stack.length) {
        const node = stack.pop();
        if (reached.has(node.id)) continue;
        reached.add(node.id); stack.push(...children.get(node.id));
      }
    };
    roots.forEach(walk);
    // A parent cycle leaves nodes unreachable from every root: cut the cycle and show them as roots.
    for (const node of byId.values()) {
      if (reached.has(node.id)) continue;
      const siblings = children.get(node.parent);
      siblings.splice(siblings.indexOf(node), 1);
      roots.push(node); walk(node);
    }
    const checks = (graph.checks || []).map(check => ({...check}));
    // An original check that needs adaptation is verified through the retained check adapting it.
    const adapters = new Map(checks.filter(check => check.group !== "retired" && check.adapts)
      .map(check => [check.adapts, check.name]));
    for (const check of checks) {
      if (check.group === "needs_adaptation" && adapters.has(check.name)) check.replaced_by = adapters.get(check.name);
    }
    const assigned = new Map([...byId.keys()].map(id => [id, []]));
    for (const check of checks) {
      const named = check.capabilities;
      for (const id of named.length ? named : roots.map(node => node.id)) if (assigned.has(id)) assigned.get(id).push(check);
    }
    return {nodes: [...byId.values()], byId, children, roots, checks, assigned, rounds: graph.rounds || []};
  }

  /* One state for several checks. A failure always shows; passes mixed with untested checks are
     "partial", never a pass, so a gap is never hidden behind a tick. */
  function combine(states) {
    const has = state => states.includes(state);
    if (has("failed")) return "failed";
    if (has("pending")) return "pending";
    if (has("partial") || (has("passed") && has("untested"))) return "partial";
    return has("passed") ? "passed" : "untested";
  }
  // Why a leaf has no valid test (leaf_coverage.why_missing reason codes).
  const PROBLEMS = {no_check: "no assigned check", not_passing_on_original: "fails on the original",
    not_repeated_identically: "not repeated identically", role_not_proven: "original role not proven",
    case_report_missing: "requested case report missing", no_passing_cases: "no passing cases",
    private_structure: "uses private names", no_behavioral_knockout_failure: "no behavioral failure when knocked out",
    knockout_not_assessed: "knockout not run within the budget", knockout_not_run: "knockout could not run",
    no_gpu_within_wait_limit: "its batch got no GPU"};
  const assessed = check => check.group !== "retired" && !check.replaced_by;
  const baselineState = check => check.group === "retired" ? "retired" : BASELINE[check.baseline] || "pending";
  /* A check's result in one round; a check missing from a finished round was not tested. */
  function checkState(check, round) {
    if (check.group === "retired") return "retired";
    const status = ((round && round.checks[check.name]) || {}).status;
    return ["passed", "failed", "untested"].includes(status) ? status : hasResults(round) ? "untested" : "pending";
  }

  /* Stage 03: a capability's directly assigned checks, coloured by the frozen original baseline. */
  function nodeAssignment(index, id) {
    const node = index.byId.get(id), checks = index.assigned.get(id) || [];
    const live = checks.filter(assessed);
    const tests = live.reduce((sum, check) => sum + (check.tests_total || 0), 0);
    if (!node || node.in_scope === false) return {status: "retired", checks, live: [], tests};
    return {status: live.length ? combine(live.map(baselineState)) : "untested", checks, live, tests};
  }

  /* Stages 04-05: a capability's result in one round, from its directly assigned checks. */
  function nodeRound(index, id, round) {
    const node = index.byId.get(id), checks = index.assigned.get(id) || [];
    const live = checks.filter(assessed);
    const counts = {passed: 0, failed: 0, untested: 0, pending: 0};
    if (!node || node.in_scope === false) return {status: "retired", checks, live: [], counts};
    for (const check of live) counts[checkState(check, round)] += 1;
    const states = Object.keys(counts).filter(state => counts[state]);
    return {status: live.length ? proven(combine(states), round) : "untested", checks, live, counts};
  }

  /* A round's overall state over every live check, including those it did not run. */
  function roundState(index, round) {
    return proven(combine(index.checks.filter(assessed).map(check => checkState(check, round))), round);
  }

  /* A capability's result in every finished round, oldest first. */
  function nodeHistory(index, id) {
    return index.rounds.filter(hasResults).map(round => ({n: round.n, status: nodeRound(index, id, round).status}));
  }

  /* Status counts over a capability's descendants, the capability itself excluded. */
  function rollup(index, id, statusOf) {
    const counts = Object.fromEntries(STATES.map(state => [state, 0]));
    const stack = [...(index.children.get(id) || [])];
    while (stack.length) {
      const node = stack.pop();
      counts[statusOf(node.id).status] += 1;
      stack.push(...(index.children.get(node.id) || []));
    }
    return counts;
  }

  /* The capabilities a view draws. "before": everything that was mapped. "after": what the
     selection kept, with the capabilities above a kept one so that the tree stays whole. */
  function scopeNodes(index, view) {
    if (view === "before") return new Set(index.byId.keys());
    const shown = new Set();
    for (const node of index.nodes) {
      if (node.in_scope === false) continue;
      for (let at = node, hops = 0; at && !shown.has(at.id) && hops < 200; at = index.byId.get(at.parent), hops += 1) shown.add(at.id);
    }
    return shown;
  }

  const within = (id, test) => id === test || id.startsWith(test + "[") || id.startsWith(test + "::");
  /* The tests of a check, one a row: those it declares by name; for a file it declares whole, the
     tests in it that the design's record names (a designed file's test functions, a scenario
     file's cases: check.named) or a failure names (else the file itself); and a failing test it
     did not declare. A parametrized case stands under the test it is a case of. */
  function checkTests(check, failing = []) {
    const noted = check.named || [], rows = [];
    const add = id => { if (!rows.includes(id)) rows.push(id); };
    for (const test of check.tests || []) {
      if (test.includes("::")) { add(test); continue; }
      const inside = [...noted, ...failing].filter(id => id.startsWith(test + "::"));
      if (inside.length) inside.forEach(add); else add(test);
    }
    for (const id of failing) if (!rows.some(test => within(id, test))) add(id);
    return rows;
  }
  /* One test's result, read from its check's: every test of a check that passed, passed. Of a
     check that failed, the tests it named failed and the others passed; one that named none did
     not say which ("unknown"). Any other state of the check is the state of each of its tests. */
  function testState(test, state, failing = []) {
    if (state !== "failed") return state;
    if (!failing.length) return "unknown";
    return failing.some(id => within(id, test)) ? "failed" : "passed";
  }
  /* What a test verifies, as far as its name says: the name of its test function, or of its
     scenario case, read as words ("test_keeps_zero" -> "keeps zero"), under the classes it stands
     in. No sentence about behavior is shown: none is written. None for a whole file. */
  function describeTest(check, test) {
    const parts = test.split("::");
    if (parts.length < 2) return null;
    const [, name, param] = parts[parts.length - 1].match(/^(.*?)(\[.*\])?$/);
    const words = value => value.replace(/^_*[Tt]est_*/, "").replace(/([a-z0-9])([A-Z])/g, "$1 $2").replaceAll("_", " ").trim().toLowerCase();
    const group = parts.slice(1, -1).map(words).filter(Boolean).join(" · ");
    return (group ? group + ": " : "") + (words(name) || name) + (param ? " " + param : "");
  }
  /* A check's state and the tests it named as failing, on the original ("assign", also stage 02) or in a round. */
  function checkResult(check, mode, round) {
    if (mode !== "results") return {state: baselineState(check), failing: check.baseline_failed_tests || []};
    return {state: proven(checkState(check, round), round), failing: ((round && round.checks[check.name]) || {}).failed_tests || []};
  }
  /* Every test of a capability's live checks with its result, failing ones first. A check without
     test ids is one row: the check itself. ``whole`` (stage 02 before the selection) also lists
     the tests of what the selection removed, which have no result: they are out of scope. */
  function nodeTests(index, id, mode, round, whole = false) {
    const node = index.byId.get(id), rows = [];
    if (!node || (node.in_scope === false && !whole)) return rows;
    const removed = check => node.in_scope === false || check.group === "retired";
    for (const check of (index.assigned.get(id) || []).filter(check => whole ? !check.replaced_by : assessed(check))) {
      const {state, failing} = removed(check) ? {state: "retired", failing: []} : checkResult(check, mode, round);
      const tests = checkTests(check, failing);
      if (!tests.length) rows.push({check: check.name, test: null, state, note: null});
      for (const test of tests) rows.push({check: check.name, test, state: testState(test, state, failing), note: describeTest(check, test)});
    }
    const rank = row => row.state === "failed" ? 0 : row.state === "unknown" ? 1 : 2;
    return rows.map((row, position) => [row, position]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(([row]) => row);
  }

  /* pytest node ids grouped by file, in declaration order. */
  function testsByFile(tests) {
    const groups = new Map();
    for (const test of tests) {

      "由一份 Markdown 写成的轨迹重建，不是从这次运行的状态录制的：调用没有参数和记录，功能图只有文档里提到的叶节点和未通过的检查。",
    "The function graph of an earlier moment is the recorded graph with the results known by then; what a plan changed later is shown as recorded.":
      "较早时刻的功能图，是录制下来的那张图加上到那时为止已知的结果；计划之后发生的改动，按录制时的样子显示。",
    "How far a long step was is known only for the moments a recording was made while it ran.":
      "一个耗时较长的步骤进行到哪里，只在它运行期间做过录制的那些时刻才知道。",
    "This trajectory holds no function graph: the job had no plan when it was recorded, or an earlier nanolize recorded it.":
      "这份 trajectory 里没有功能图：录制时作业还没有计划，或者它是由较早版本的 nanolize 录制的。",

    if (seconds < 5970) return T("{n} min", {n: (seconds / 60).toFixed(seconds < 600 ? 1 : 0)});

  }
  /* A duration in a few characters, for a tile or a folded stretch: 45s, 12m, 6h 28m. */
  function brief(seconds) {
    if (!isNumber(seconds)) return "–";

  }
  function ms(iso) { const value = typeof iso === "string" ? Date.parse(iso) : NaN; return isNaN(value) ? null : value; }

    const at = typeof value === "number" ? value : ms(value);

  }

  function money(value) { return isNumber(value) ? "$" + value.toFixed(value < 10 ? 2 : value < 1000 ? 2 : 0) : "–"; }
  function percent(value, digits) { return isNumber(value) ? value.toFixed(digits === undefined ? 1 : digits) + "%" : "–"; }
  function words(value) { return typeof value === "string" ? value.replace(/_/g, " ") : value === null || value === undefined ? "–" : String(value); }

  // ---------------------------------------------------------------- the time scale
  const TICKS = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400];
  /* Where a time stands on a line ``width`` px long. ``intervals``: [start, end] in ms of everything
     drawn. A stretch in which nothing was drawn for longer than ten minutes and a fifth of the busy
     time is folded to ``fold`` px (options.compress false: none is), so that a run its owner held for
     hours still shows its work. Returns x(ms), the ticks, the folded stretches and the width. */
  function timeScale(intervals, width, options) {
    const fold = (options && options.fold) || 64, compress = !(options && options.compress === false);
    const spans = intervals.filter((span) => isNumber(span[0])).map((span) => [span[0], Math.max(span[0], isNumber(span[1]) ? span[1] : span[0])])
      .sort((a, b) => a[0] - b[0]);
    if (!spans.length) return null;
    const busy = [];
    for (const span of spans) {
      const last = busy[busy.length - 1];
      if (last && span[0] <= last[1]) last[1] = Math.max(last[1], span[1]); else busy.push(span.slice());
    }
    const worked = busy.reduce((sum, span) => sum + span[1] - span[0], 0);
    const longest = compress ? Math.max(600000, worked / 5) : Infinity;
    const parts = [];
    for (const span of busy) {
      const last = parts[parts.length - 1];
      if (last && span[0] - last[1] <= longest) last[1] = span[1]; else parts.push(span.slice());
    }
    const shown = Math.max(1000, parts.reduce((sum, span) => sum + span[1] - span[0], 0));
    const rate = Math.max(40, width - fold * (parts.length - 1)) / shown;
    let left = 0;
    const placed = parts.map((span) => { const item = {from: span[0], to: span[1], x: left, width: (span[1] - span[0]) * rate}; left += item.width + fold; return item; });
    const total = left - fold;
    function x(at) {
      if (at <= placed[0].from) return 0;
      for (let index = 0; index < placed.length; index++) {
        const part = placed[index], next = placed[index + 1];
        if (at <= part.to) return part.x + (at - part.from) * rate;
        if (!next) return part.x + part.width;
        if (at < next.from) return part.x + part.width + fold * (at - part.to) / (next.from - part.to);
      }
      return total;
    }
    const step = (TICKS.find((seconds) => seconds * 1000 * rate >= 84) || TICKS[TICKS.length - 1]) * 1000;
    const ticks = [];
    let previous = -Infinity, shownDay = null;
    for (const part of placed) {
      for (let at = Math.ceil(part.from / step) * step; at <= part.to; at += step) {
        const position = x(at);
        if (position - previous < 58 || total - position < 30 || part.x + part.width - position < 40 && part !== placed[placed.length - 1]) continue;
        const date = day(at);
        ticks.push({at, x: position, label: (shownDay !== null && date !== shownDay ? date.slice(5) + " " : "") + clock(at, step < 60000)});
        previous = position; shownDay = date;
      }
    }
    const folds = placed.slice(0, -1).map((part, index) => ({x: part.x + part.width, width: fold, from: part.to, to: placed[index + 1].from}));
    return {x, ticks, folds, width: total, start: placed[0].from, end: placed[placed.length - 1].to, rate};
  }

  /* Rows for bars that share a lane: each bar ({t0, t1} in ms) takes the first row whose last bar had
     ended when it began, so one row holds what ran one after the other and a further row what ran at
     the same time. Returns the number of rows; at most ``most``, the last one takes the rest. */
  function pack(bars, most) {
    const ends = [];
    for (const bar of bars.slice().sort((a, b) => a.t0 - b.t0 || a.t1 - b.t1)) {
      let row = ends.findIndex((end) => end <= bar.t0 + 50);
      if (row < 0) row = ends.length < (most || 24) ? ends.push(0) - 1 : ends.length - 1;

  }

  // ---------------------------------------------------------------- what the timeline draws
  function sessionTone(session) {
    if (session.exit_code === 0 || session.status === "completed" && session.exit_code == null) return "good";
    if (isNumber(session.exit_code) && session.exit_code !== 0) return "bad";
    return session.status === "reported" ? "good" : "neutral";
  }
  function stageTitle(catalog, id) {
    const stage = ((catalog || {}).stages || []).find((item) => item.id === id);
    return stage ? T(stage.title) : id ? words(id) : "–";
  }
  function toolTitle(catalog, name) {
    const tool = ((catalog || {}).tools || {})[name];
    return tool && tool.title ? T(tool.title) : words(name);
  }
  function roleTitle(role) { return words(role).replace(/^./, (letter) => letter.toUpperCase()); }

  /* The lanes of the timeline for one job's parts: the host agent's two stages, the owner and the
     worker (marks), the controller's rounds, the tool calls, and one lane for each role of model
     session but the controller's (a round is its session). Each bar: t0, t1 (ms), tone, title, lines
     (its tooltip) and step (the id of the step a click opens). */
  /* When the record of a run that still goes was last written: what runs then has run until then. null for a run
     that has ended, whose steps all have their ends. */
  function recordEnd(document_) {
    const recorder = (document_ && document_.recorder) || {};
    return recorder.complete === false ? ms(recorder.recorded_at) : null;
  }

  /* ``until``: the end of the record of a run that still goes (recordEnd): a call or a session without an end is

  function lanes(parts, run, catalog, until) {
    const out = [], job = parts.job || {};

      const from = mapped !== null ? mapped : begun;
      if (from !== null && submitted !== null && submitted > from)

      if (step.kind === "session" && ms(step.at) !== null)

      if (step.kind === "owner" && ms(step.at) !== null)

    }

  // ---------------------------------------------------------------- the steps

        current = {kind: "plain", by: step.by, calls: []};
        out.push(current);
      }
      current.calls.push(step);
    }
    return out;
  }

  function record(step, kind) {
    const records = step.records || {};
    for (const id of Object.keys(records)) if (records[id].kind === kind) return records[id];
    return null;
  }

  /* What a call was about and what came of it, in one line: its role, scope and mode, a comparison's

  function callLine(step) {

    if (isNumber(detail.parts)) out.push(T("{n} parts", {n: detail.parts}));
    if (isNumber(detail.check_names)) out.push(T("{n} checks named", {n: detail.check_names}));
    if (isNumber(detail.leaves)) out.push(T("{n} leaves", {n: detail.leaves}));
    if (isNumber(detail.capabilities) && step.tool !== "create_workspace") out.push(T("{n} capabilities", {n: detail.capabilities}));
    if (isNumber(detail.issue_ids)) out.push(T("{n} issues", {n: detail.issue_ids}));

  /* Whether a call is shown under a filter (all, problems, authors, comparisons) and a search text,

  function matches(step, filter, query) {
    if (filter === "problems" && !(step.tone === "bad" || step.tone === "warn")) return false;
    if (filter === "authors" && step.actor !== "author") return false;
    if (filter === "comparisons" && !record(step, "verification")) return false;
    const text = (query || "").trim().toLowerCase();
    if (!text) return true;
    const held = [step.id, step.tool, step.outcome, step.status, step.candidate, step.made, callLine(step),
      JSON.stringify(step.params || ""), JSON.stringify(step.result || ""), JSON.stringify(step.records || "")].join("\n").toLowerCase();
    return text.split(/\s+/).every((word) => held.includes(word));
  }

  // ---------------------------------------------------------------- the numbers at the top
  /* What stands for the counts of a comparison whose record was too large to read (trajectory._unread_comparison). */
  const unread = (row) => T("record too large ({bytes} bytes)", {bytes: count(row.unreadable.bytes)});
  function lastFull(parts) {
    const full = (parts.comparisons || []).filter((item) => item.scope === "full");
    return full.length ? full[full.length - 1] : null;
  }
  /* The stat tiles of one job's parts: label, value, note. */
  function tiles(parts) {
    const totals = parts.totals || {}, sessions = totals.sessions || {}, rounds = totals.rounds || {}, calls = totals.calls || {};
    const roles = sessions.by_role || {}, out = [], size = totals.size || {}, full = lastFull(parts);
    out.push({label: T("Run time"), value: brief(totals.wall_seconds), note: isNumber(totals.active_seconds) ? T("{n} active", {n: duration(totals.active_seconds)}) : ""});
    if ((parts.job || {}).strategy === "controller")
      out.push({label: T("Controller rounds"), value: count(rounds.recorded), note: T("{n} deciding", {n: duration(rounds.seconds)})});
    const troubled = Object.keys(calls.by_status || {}).filter((key) => key !== "ok").reduce((sum, key) => sum + calls.by_status[key], 0);
    out.push({label: T("Tool calls"), value: count(calls.recorded), note: troubled ? T("{n} did not end ok", {n: troubled}) : T("all ended ok")});
    out.push({label: T("Model sessions "), value: count(sessions.recorded), note: T("{n} of model time", {n: duration(sessions.seconds)})});
    const output = Object.keys(roles).reduce((sum, key) => sum + (roles[key].output_tokens || 0), 0);
    if (sessions.tokens) out.push({label: T("Tokens"), value: compact(sessions.tokens), note: T("{n} output", {n: compact(output)})});
    if (isNumber(sessions.cost_usd))
      out.push({label: T("Cost"), value: money(sessions.cost_usd), note: sessions.cost_complete ? T("as the runners reported") : T("a lower bound")});
    out.push({label: T("Candidates"), value: count(totals.candidates), note: T("{n} comparisons", {n: (totals.comparisons || {}).recorded || 0})});
    if (full && full.checks) out.push({label: T("Checks passed"), value: full.checks.passed + " / " + full.checks.total, note: T("in the last full comparison")});
    // The last full comparison's record was too large to read: the tile says so, and shows no earlier comparison's numbers.
    else if (full && full.unreadable) out.push({label: T("Checks passed"), value: "–", note: unread(full)});
    if (isNumber(size.retained_percent))
      out.push({label: T("Size"), value: percent(size.retained_percent), note: T("{n} tokens, target {t}", {n: compact(size.total_tokens), t: compact(size.target_tokens)})});
    return out;
  }
  function statusTone(status) {
    return status === "succeeded" || status === "draft_ready" ? "good" : status === "completed_with_gaps" || status === "paused" || status === "blocked" ? "warn"
      : status === "failed" || status === "cancelled" || status === "delivered_with_failures" ? "bad" : status ? "run" : "neutral";
  }

  // ================================================================ the browser part
  /* ------------------------------------------------------------ the run at a moment
     A trajectory says when everything began and ended, so the run can be shown as it stood at any moment: what
     ran then, who worked on which capability, and what the function graph said of each check. */

  // A job's status after an event of this phase; after any other phase the job is at work.

    function chartFrame(title, note, width, height) {

    const short = (id) => String(id || "").replace("candidate-", "c");
