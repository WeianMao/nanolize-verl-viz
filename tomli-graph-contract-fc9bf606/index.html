<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tomli · Graph-contract 运行报告</title>
<style>
:root{color-scheme:light;--ink:#122a35;--muted:#5a6a70;--line:#dbe4e6;--green:#08796b;--bg:#f5f8f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1180px;margin:auto;padding:52px 28px}header{border-bottom:1px solid var(--line);padding-bottom:32px;margin-bottom:32px}.eyebrow{color:var(--green);font-weight:700;font-size:13px;letter-spacing:.1em}h1{font-size:clamp(32px,5vw,56px);line-height:1.15;margin:18px 0}h2{font-size:24px;margin:36px 0 16px}h3{font-size:17px;margin:0 0 8px}.muted,small{color:var(--muted)}.pill{display:inline-block;padding:4px 12px;border:1px solid var(--line);border-radius:20px;font-size:13px;background:white}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.num{font-size:32px;font-weight:700;line-height:1.25;margin:8px 0}.bar{height:8px;background:#e8efed;border-radius:8px;margin-top:18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.box{background:white;border:1px solid var(--line);border-radius:14px;padding:24px;margin:16px 0}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}td:last-child{font-variant-numeric:tabular-nums}pre{overflow:auto;white-space:pre-wrap;word-break:break-word;background:#f4f7f7;padding:14px;border-radius:8px;font-size:12px}code{font-size:13px}details{border-bottom:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font-weight:650}a{color:var(--green)}.graph{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.node{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fafcfb}.node b{display:block}.node small{display:block;margin-top:6px}footer{border-top:1px solid var(--line);margin-top:36px;padding-top:20px;font-size:13px}.scroll{overflow:auto}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.graph{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){main{padding:28px 16px}.cards,.graph{grid-template-columns:1fr}.box{padding:16px}}
</style>
<main><header><div class="eyebrow">NANOLIZE / GRAPH-CONTRACT / REAL PROJECT RUN</div><h1>Tomli 压缩运行报告</h1><p class="muted" id="lead">正在加载运行证据…</p><div id="badges"></div></header><section class="cards" id="metrics"></section><section><h2>验证与测试设计</h2><div class="box" id="validation"></div></section><section><h2>全部功能范围</h2><p class="muted">功能图全部选中；点击节点查看接口与验证说明。</p><div class="graph" id="graph"></div></section><section><h2>清单转换</h2><div class="box scroll"><table id="conversion"></table></div></section><section><h2>运行过程与防默写</h2><div class="box" id="run"></div></section><section><h2>问题与绕过记录</h2><div class="box" id="issues"></div></section><section><h2>计量口径与局限</h2><div class="box" id="limits"></div></section><footer id="footer"></footer></main>
<script>
const el=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('report-data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{
el('lead').textContent=d.lead;el('badges').innerHTML=d.badges.map(x=>`<span class="pill">${e(x)}</span> `).join('');
el('metrics').innerHTML=d.metrics.map(m=>`<article class="card"><small>${e(m.label)}</small><div class="num">${e(m.value)}</div><small>${e(m.note)}</small>${m.percent==null?'':`<div class="bar"><i style="width:${Math.max(0,Math.min(100,m.percent))}%"></i></div>`}</article>`).join('');
el('validation').innerHTML=d.validation.map(x=>`<p>${e(x)}</p>`).join('');
el('graph').innerHTML=d.capabilities.map(n=>`<details class="node"><summary>${e(n.label)}</summary><small>${e(n.id)} · ${e(n.surface)} · ${e(n.status)}</small><p>${e(n.description)}</p>${n.interface.map(t=>`<small>${e(t)}</small>`).join('')}</details>`).join('');
el('conversion').innerHTML='<thead><tr><th>转换报告字段</th><th>数量</th><th>说明</th></tr></thead><tbody>'+d.conversion.map(x=>`<tr><td><code>${e(x.key)}</code></td><td>${e(x.count)}</td><td>${e(x.note)}</td></tr>`).join('')+'</tbody>';
el('run').innerHTML=d.run.map(x=>`<p>${e(x)}</p>`).join('');
el('issues').innerHTML=d.issues.map(x=>`<details><summary>${e(x.title)}</summary><pre>${e(x.body)}</pre></details>`).join('')||'<p>未记录问题。</p>';
el('limits').innerHTML=d.limits.map(x=>`<p>${e(x)}</p>`).join('');
el('footer').innerHTML=`<p>作业 ${e(d.job_id)} · ${e(d.completed_at)}</p><p><a href="report-data.json">下载报告数据</a> · <a href="issues.md">下载 issues.md</a></p>`;
}).catch(err=>{el('lead').textContent='报告数据暂时不可用：'+err.message});
</script></html>
